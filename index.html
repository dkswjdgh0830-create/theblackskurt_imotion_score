<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감정악보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nanum+Myeongjo:wght@400;800&family=Nanum+Pen+Script&display=swap">
<style>
/* 첫 화면은 3D 앨범 박스, 열면 평면 인터페이스. 인터페이스에서는 카메라가 움직이지 않고 물건이 눈앞으로 나온다 */
:root{--wall:#c9c7c3;--ink:#161412;--sub:#a19a92;--paper:#fbf9f4;--ease:cubic-bezier(.2,.7,.2,1)}
/* 바탕: 색 없는 조명이 위에서 비추는 회색 공간. 색은 박스에만 */
html,body{margin:0;height:100%;overflow:hidden;background:#8f8d8a radial-gradient(ellipse 70% 62% at 50% 34%,#e9e8e5 0%,#d2d0cc 38%,#a9a7a3 78%,#8b8986 100%) fixed;font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--ink)}
/* 첫 화면: 검정 바탕에 질문이 한 줄씩. 스크롤하면 미색으로 밝아지며 제목(앨범 박스 표지)이 나온다 */
#q{position:fixed;inset:0;z-index:25;background:#141210;color:#EDE8E0;display:flex;align-items:center;justify-content:center;transition:background 1.2s,opacity .9s .5s}
#q.lift{background:#c9c7c3;opacity:0;pointer-events:none}
#q .in{transition:opacity .6s}#q.lift .in{opacity:0}
#q p{margin:0;font-size:2.3vh;line-height:1.9;opacity:0;animation:qin 1s var(--ease) forwards}
#q p.big{font-size:3.1vh;font-weight:600}#q p.gap{height:2.6vh}
#q canvas{position:absolute;left:50%;bottom:-3vh;transform:translateX(-50%);height:12vh;opacity:0;animation:qin 1.4s 5.4s forwards}
@keyframes qin{from{opacity:0;transform:translateY(.6vh)}to{opacity:1;transform:none}}
#q canvas{animation-name:qfade}@keyframes qfade{to{opacity:1}}
#intro{position:fixed;inset:0;z-index:20;transition:opacity .9s}
#intro.gone{opacity:0;pointer-events:none}
#intro canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;opacity:0;transition:opacity .9s}
#ui.on{opacity:1}

/* 앨범 구성물: 같은 크기로 한 줄. 가운데 하나만 선택 카드 안에 들어가고 이름이 붙는다. 아래는 플레이어 */
:root{--V:26vh;--step:38vh}
#frame{position:absolute;left:50%;top:6vh;width:calc(var(--V) + 8vh);height:calc(var(--V) + 15vh);transform:translateX(-50%);border-radius:2.2vh;
  background:rgba(255,255,255,.5);border:1px solid rgba(22,20,18,.07);box-shadow:0 2px 10px rgba(40,30,20,.04);pointer-events:none}
#frame .ic{position:absolute;right:1.6vh;top:1.6vh;width:2.8vh;height:2.8vh;border-radius:50%;border:1px solid rgba(22,20,18,.14);display:flex;align-items:center;justify-content:center}
#frame .ic svg{width:1.2vh;height:1.2vh}
.meta .sub{font-size:1.3vh;color:var(--sub);font-weight:500;line-height:1.4}
.meta .ttl{font-size:1.75vh;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame .meta{position:absolute;left:4vh;right:4vh;bottom:2.8vh}
.slot{position:absolute;left:50%;top:10vh;width:var(--V);height:var(--V);margin-left:calc(var(--V) / -2);display:flex;align-items:center;justify-content:center;
  transition:transform .6s var(--ease),opacity .6s;cursor:pointer}
.slot .vis{position:relative;filter:drop-shadow(0 10px 16px rgba(40,30,20,.14));transition:transform .35s var(--ease)}
.slot.sel:hover .vis{transform:translateY(-.8vh)}
.vis.away{visibility:hidden}
#bk canvas{display:block;height:var(--V)}
#cb{width:var(--V);height:calc(var(--V) * .8)}
#cb .peek{position:absolute;left:4%;right:4%;bottom:46%;height:40%}
#cb .peek canvas{position:absolute;left:0;width:100%;border-radius:2px;box-shadow:0 -1px 0 rgba(0,0,0,.06)}
#cb .front{position:absolute;left:0;right:0;bottom:0;height:56%;background:#f4f1ea;border-radius:3px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 #fff,inset 0 -6px 12px rgba(0,0,0,.04)}
#cb .front span{font-weight:700;font-size:1.8vh;letter-spacing:.02em}
.lpv{display:block;width:var(--V);height:var(--V);border-radius:50%}
.sleeve{width:var(--V);height:var(--V)}
.sleeve .lpv{position:absolute;left:30%;top:3%;width:94%;height:94%;transition:left .7s var(--ease)}
.slot.sel .sleeve .lpv{left:42%}
.sleeve .cover{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(.96);border-radius:1px}
.lpv.away{visibility:hidden}
/* 재생 중: 곡의 악보가 시간을 따라 채워진다 */
#now{position:absolute;left:50%;top:calc(6vh + var(--V) + 18vh);transform:translateX(-50%);width:84vh;display:flex;align-items:center;gap:3vh;opacity:0;transition:opacity .6s;pointer-events:none}
#now.on{opacity:1}
#now .meta{width:17vh;flex:none}
#now canvas{flex:1;min-width:0;height:6.5vh}
#player{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80vh;height:38vh;cursor:pointer}

/* 눈앞 무대 */
#veil{position:fixed;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(40,38,36,.55),rgba(14,13,12,.86));backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .5s;z-index:5}
#veil.on{opacity:1;pointer-events:auto}
.fly{position:fixed;left:0;top:0;z-index:6;transition:transform .9s var(--ease);transform-origin:0 0}

/* 부클릿 */
#book{position:fixed;z-index:6;perspective:3000px}
#book .pages{position:absolute;inset:0;transition:transform .8s var(--ease);transform-style:preserve-3d}
#book .base{position:absolute;left:50%;top:0;width:50%;height:100%}
#book .leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .9s var(--ease)}
#book .leaf.on{transform:rotateY(-180deg)}
#book .face{position:absolute;inset:0;backface-visibility:hidden;box-shadow:0 10px 30px rgba(40,30,20,.12)}
#book .face.b{transform:rotateY(180deg)}
#book canvas{width:100%;height:100%;display:block}

/* 악보 카드 */
#deck{position:fixed;inset:0;z-index:6;perspective:1800px;pointer-events:none}
.card{position:absolute;left:50%;top:50%;transition:transform .7s var(--ease),opacity .5s;transform-style:preserve-3d;pointer-events:auto;cursor:pointer}
.card .in{position:absolute;inset:0;transition:transform .7s var(--ease);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(40,30,20,.16)}
.card .f canvas{width:100%;height:100%;display:block}
.card .bk{transform:rotateY(180deg);background:var(--paper);padding:5% 6%;box-sizing:border-box;font-size:1.5vh;line-height:1.85;white-space:pre-wrap;columns:2;column-gap:5%}

.card .play{position:absolute;right:2.5%;top:5%;width:5.4vh;height:5.4vh;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center}
.card.cur .play{display:flex}
.card .play svg{width:1.8vh;height:1.8vh;margin-left:.3vh}

/* 가사 넣기 (작업용. 가사는 저장하지 않고 이 화면에서만 쓴다) */
#lyrBtn{position:fixed;right:14px;bottom:12px;z-index:30;font:12px Pretendard;padding:4px 9px;border:1px solid #d6d0c7;background:#faf8f4;color:#8d867d;cursor:pointer;display:none}
#lyrPanel{position:fixed;right:14px;bottom:44px;z-index:30;width:320px;background:#faf8f4;border:1px solid #d6d0c7;padding:10px;display:none;font-size:12px;color:#8d867d}
#lyrPanel textarea{width:100%;height:260px;box-sizing:border-box;font:12px/1.5 Pretendard}
#lyrPanel button{margin-top:6px;font:12px Pretendard}

/* ══ 필름 리디자인 (레퍼런스: Vagabon, Leith Ross, Mitski, Elsa Hanneke, Big Thief, do not stop the car, A letter to you) ══
   내용, 데이터, 인터랙션 로직, 인코딩은 그대로. 색은 데이터 박스에만 쓴다. 조명과 그레인은 무채색 */
:root{--film:#141210;--film2:#1d1a17;--line:rgba(237,232,224,.28);--hi:#ece7dd;--lo:#8f887f;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--letter:"Nanum Myeongjo",serif;--hand:"Nanum Pen Script",cursive}

/* 공간: 새벽 방, 천장 스탠드 하나가 위에서 비추는 어두운 방 (Mitski의 쓸쓸한 톤) */
html,body{background:#121110 radial-gradient(ellipse 58% 70% at 50% 18%,#a9a6a1 0%,#6e6b67 34%,#2f2d2a 68%,#141311 100%) fixed}

/* 그레인: 눈에 보이게 굵고 살아 있게 (Vagabon). 무채색 노이즈를 overlay로 얹어 박스 색상은 그대로 */
#grain{position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:overlay;opacity:.3;background-size:256px 256px;will-change:background-image}
body:has(#q) #grain{opacity:.4}
/* 박스가 눈앞에 크게 나올 때(부클릿, 카드)는 그레인을 낮춰 박스 색을 지킨다 */
body:has(#veil.on) #grain{opacity:.13}
/* 가로 스캔 줄: 아주 옅은 빛 띠가 천천히 내려간다 */
#grain::after{content:'';position:absolute;left:0;right:0;height:14vh;top:-20vh;background:linear-gradient(transparent,rgba(255,255,255,.22),transparent);animation:scan 9s linear infinite}
@keyframes scan{to{transform:translateY(140vh)}}
/* 빛 먼지: 흐린 빛 알갱이가 천천히 떠오른다 (do not stop the car) */
#dust{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#dust i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);filter:blur(2px);animation:drift linear infinite}
@keyframes drift{from{transform:translate3d(0,8vh,0);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translate3d(3vw,-110vh,0);opacity:0}}
body:has(#veil.on) #dust{opacity:.4}
/* 비네팅: 화면 가장자리가 필름처럼 어두워진다 */
#vig{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%)}
/* 재단선: 인쇄 시트의 십자와 눈금 (Elsa Hanneke) */
.reg{position:fixed;z-index:38;pointer-events:none;background:var(--line)}
.reg.t,.reg.b{left:50%;width:1px;height:3.2vh}.reg.t{top:0}.reg.b{bottom:0}
.reg.l,.reg.r{top:50%;height:1px;width:3.2vh}.reg.l{left:0}.reg.r{right:0}
/* 필름 페이드: 장면이 바뀔 때 천천히 어두워졌다 밝아진다 */
#fade{position:fixed;inset:0;z-index:36;pointer-events:none;background:#0c0b0a;opacity:0}
#fade.on{animation:ffade 1.1s ease-in-out}
@keyframes ffade{45%{opacity:.62}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#grain::after,#dust i{animation:none;display:none}#fade.on{animation:none}}

/* 첫 화면: 검정 필름, 편지처럼 명조로. 한 줄씩 흐림에서 또렷해진다 (Vagabon, A letter to you) */
#q{background-color:var(--film)}
#q.lift{background-color:#3a3835}
/* 라이트 릭: 검정 쪽 한 곳에만. 오른쪽 위 모서리에서 옅게 번진다 */
#q::before{content:'';position:absolute;inset:0;pointer-events:none;transition:opacity 1.2s ease-in-out;
  background:radial-gradient(ellipse 85% 75% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%),radial-gradient(ellipse 40% 50% at 100% 0%,rgba(214,96,52,.08),rgba(214,96,52,0) 70%)}
#q.lift::before{opacity:0}
#q p{font-family:var(--letter);font-size:2.2vh;line-height:2.3;letter-spacing:.02em;color:#ddd6cb;animation:qblur 1.8s var(--ease) forwards;text-shadow:0 0 .6px rgba(237,232,224,.6)}
#q p.big{font-family:var(--letter);font-weight:800;font-size:3vh;color:#f1ece3;letter-spacing:-.005em;line-height:2.1}
@keyframes qblur{from{opacity:0;filter:blur(8px);transform:translateY(.4vh)}to{opacity:1;filter:blur(0);transform:none}}

/* 선택 프레임: 둥근 앱 카드 대신 필름 시트의 칸. 얇은 선, 모서리 눈금, 프레임 번호 (Elsa Hanneke) */
#frame{background:transparent;border:1px solid var(--line);border-radius:0;box-shadow:none}
#frame::before,#frame::after{content:'';position:absolute;width:1.4vh;height:1.4vh;border-color:var(--hi);border-style:solid;opacity:.8}
#frame::before{left:-1px;top:-1px;border-width:1px 0 0 1px}#frame::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
#frame .ic{border-color:var(--line)}#frame .ic svg path{stroke:var(--hi)}
#frame .no{position:absolute;left:1.6vh;top:1.6vh;font:400 1.1vh/1 var(--mono);letter-spacing:.14em;color:var(--lo)}
.meta .sub{font-family:var(--mono);font-size:1.1vh;letter-spacing:.16em;text-transform:uppercase;color:var(--lo)}
.meta .ttl{color:var(--hi);font-weight:600;letter-spacing:-.01em;text-shadow:0 0 .6px rgba(236,231,221,.5)}
.meta .ttl.in{animation:tblur .9s var(--ease)}
@keyframes tblur{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}

/* 물건: 손으로 놓은 듯 조금씩 기울어 있다가 고르면 바로 선다. 인화지 여백 (Leith Ross) */
.slot .vis{filter:drop-shadow(0 18px 22px rgba(0,0,0,.45));transition:transform .7s var(--ease),filter .7s}
.slot:nth-child(1) .vis{transform:rotate(-1.8deg)}.slot:nth-child(2) .vis{transform:rotate(1.3deg)}
.slot:nth-child(3) .vis{transform:rotate(-.9deg)}.slot:nth-child(4) .vis{transform:rotate(2deg)}.slot:nth-child(5) .vis{transform:rotate(-1.4deg)}
.slot.sel .vis{transform:none}.slot.sel:hover .vis{transform:translateY(-.8vh)}
.slot:not(.sel) .vis{filter:drop-shadow(0 18px 22px rgba(0,0,0,.45)) brightness(.62) saturate(.9)}
#bk{background:#efe9df;padding:.9vh .9vh 2.6vh}  /* 인화지 여백: 아래가 조금 더 넓다 */
#cb .front{background:#ebe5da;border-radius:1px}
#cb .front span{font-family:var(--mono);font-weight:500;font-size:1.25vh;letter-spacing:.18em;color:#3a3530}

/* 재생 중 줄 */
#now .ttl{color:var(--hi)}#now canvas{filter:drop-shadow(0 0 0 transparent)}

/* 눈앞 무대: 배경이 크게 흐려진다 (Big Thief) */
#veil{background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(30,28,26,.5),rgba(8,7,6,.9));backdrop-filter:blur(16px) brightness(.8);transition:opacity 1s ease-in-out}

/* 카드: 인화지 여백 위에 악보. 뒷면 가사는 손글씨 편지처럼 (A letter to you) */
.card .f{background:#efe9df;padding:2.2%;box-sizing:border-box;border-radius:2px;box-shadow:0 24px 40px rgba(0,0,0,.5)}
.card .f canvas{border-radius:1px}
.card .bk{background:#efe9df;border-radius:2px;font-family:var(--hand);font-size:2.3vh;line-height:1.55;color:#2a2622;columns:2;column-gap:7%;padding:6% 8%}

/* 트랙 리스트: 번호 붙은 목록, 지금 카드만 밝게 (Big Thief, Elsa Hanneke) */
#tracks{position:fixed;left:3.2vw;top:50%;transform:translateY(-50%);z-index:7;font:400 1.05vh/1.55 var(--mono);color:var(--hi);letter-spacing:.04em;opacity:0;transition:opacity .9s ease-in-out;max-height:84vh;overflow:hidden}
#tracks.on{opacity:1}
#tracks .al{color:var(--lo);letter-spacing:.16em;margin:1.1vh 0 .3vh}
#tracks .tr{cursor:pointer;opacity:.32;transition:opacity .4s;white-space:nowrap}
#tracks .tr:hover{opacity:.7}#tracks .tr.on{opacity:1}
#tracks .tr b{font-weight:400;color:var(--lo);margin-right:1.2em}

/* 소리 크기: 재생 줄 오른쪽, 얇은 선 하나 */
#now .vol{display:flex;align-items:center;gap:1vh;flex:none;pointer-events:auto;font:400 1.05vh var(--mono);letter-spacing:.16em;color:var(--lo)}
#now .vol input{-webkit-appearance:none;appearance:none;width:11vh;height:2.4vh;background:transparent;cursor:pointer;margin:0}
#now .vol input::-webkit-slider-runnable-track{height:1px;background:var(--line)}
#now .vol input::-moz-range-track{height:1px;background:var(--line)}
#now .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:1.1vh;height:1.1vh;border-radius:50%;background:var(--hi);margin-top:-.5vh}
#now .vol input::-moz-range-thumb{width:1.1vh;height:1.1vh;border:0;border-radius:50%;background:var(--hi)}
/* 가사 넣기 패널도 같은 톤 */
#lyrPanel{background:#1d1a17;border-color:#3a3631;color:#9c958c}#lyrPanel textarea{background:#141210;color:#ddd6cb;border:1px solid #3a3631}

/* 모바일 (375px 기준) */
html,body{touch-action:manipulation}
@media (max-width:600px){
  :root{--V:56vw;--step:68vw}
  #frame{top:7vh;width:calc(var(--V) + 10vw);height:calc(var(--V) + 15vh)}.slot{top:calc(7vh + 5vw)}
  #frame .meta{left:5vw;right:5vw;bottom:2.4vh}#frame .no{left:3vw;top:1.4vh}
  #now .vol span{display:none}#now .vol input{width:16vw}
  #now{width:90vw;gap:3vw;top:calc(7vh + var(--V) + 19vh)}#now .meta{width:26vw}#now canvas{height:6vh}
  #player{width:110vw;height:31vh}
  .card .bk{columns:1;font-size:2vh;padding:5% 7%}
  .card .play{width:9vw;height:9vw}
  .meta .sub{font-size:1.45vh}.meta .ttl{font-size:2.3vh}
  #tracks{display:none}
  #grain{background-size:180px 180px}
  #q p{font-size:2vh}#q p.big{font-size:2.6vh}
}
</style>

<div id="dust" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div><div id="vig" aria-hidden="true"></div><div id="fade" aria-hidden="true"></div>
<i class="reg t"></i><i class="reg b"></i><i class="reg l"></i><i class="reg r"></i>
<div id="q"><div class="in" id="qIn"></div></div>
<div id="intro"></div>
<div id="ui">
  <div id="frame"><div class="no" id="fNo"></div><div class="ic"><svg viewBox="0 0 10 10"><path d="M2 8L8 2M3.5 2H8V6.5" fill="none" stroke="#161412" stroke-width="1.2"/></svg></div>
    <div class="meta"><div class="sub" id="fSub"></div><div class="ttl" id="fTtl"></div></div></div>
  <div id="row"></div>
  <div id="now"><div class="meta"><div class="sub" id="nSub"></div><div class="ttl" id="nTtl"></div></div><canvas id="nCv" width="1800" height="180"></canvas>
    <label class="vol"><span>VOL</span><input id="vol" type="range" min="0" max="1" step="0.01" aria-label="소리 크기"></label></div>
  <canvas id="player"></canvas>
</div>
<div id="veil"></div>
<div id="deck"></div>

  return ok?lines.map(l=>l.split(/\s+/)):null;}
function sheet(c,x0,y0,mode,fs,words){let y=y0,li=0;const sp=c.measureText(' ').width;c.font=`500 ${fs}px ${F}`;c.textBaseline='middle';
  CHORUS.forEach(u=>{u.w.forEach((ws,j)=>{const W=words?words[li].map(w=>c.measureText(w).width):ws.map(w=>w*fs);let x=x0;const xs=W.map(w=>{const s=x;x+=w+sp*1.2;return s;});
    const picked=i=>(u.b[j]||[]).some(([a,b])=>i>=a&&i<=b),col=colOf(u.k,u.a,u.e);
    if(mode==='paint'||mode==='boxes')(u.b[j]||[]).forEach(([a,b])=>{c.fillStyle=col.c;c.fillRect(xs[a]-4,y-fs*.62,xs[b]+W[b]-xs[a]+8,fs*1.24);});

      if(words){c.fillStyle=ink;c.fillText(words[li][i],xs[i],y);}else if(!(mode==='paint'&&picked(i))){c.fillStyle=ink;c.fillRect(xs[i],y-fs*.18,w-3,fs*.36);}});
    y+=fs*1.9;li++;});y+=fs*.9;});c.textBaseline='alphabetic';return Math.max(...CHORUS.flatMap((u,ui)=>u.w.map(ws=>ws.reduce((t,w)=>t+w*fs+sp*1.2,0))));}

  for(let r=w*.17;r<w*.49;r+=1.6){c.strokeStyle=`rgba(0,0,0,${.03+Math.random()*.04})`;c.beginPath();c.arc(w/2,w/2,r,0,7);c.stroke();}

  const r0=w*.18,r1=w*.485,step=Math.PI*2/x,bw=step*(r0+r1)/2*.7;c.save();c.translate(w/2,w/2);
  cols.forEach(cc=>{c.save();c.rotate(cc.x*step);cc.boxes.forEach(b=>{const ra=r0+(r1-r0)*b.y0/MAXLEN,rb=r0+(r1-r0)*b.y1/MAXLEN;c.fillStyle=b.c;c.fillRect(-bw/2,-rb,bw,rb-ra);});c.restore();});
  c.fillStyle='#efe8d9';c.beginPath();c.arc(0,0,w*.165,0,7);c.fill();c.fillStyle='#bdb6a8';c.beginPath();c.arc(0,0,w*.008,0,7);c.fill();c.restore();});

// ── 재생: LP 한 장을 고르면 그 앨범 전체, 악보 카드를 넣으면 그 곡 하나. 소리는 없다 (음원 저작권) ──
const ARM_OUT=-.33,ARM_IN=-.56,SEC=.4; // 바늘 각도 (바깥 홈, 안쪽 홈), 줄 하나에 걸리는 초
const durOf=s=>layoutUnits(s.u,{cell:1,lineGap:1,unitGap:1,pad:0}).cols.length*SEC;
let playing=null;
const nc=$('nCv'),nx=nc.getContext('2d');
function drawNow(s,p){const w=nc.width,h=nc.height;nx.clearRect(0,0,w,h);
  // 가로 = 시간이라 폭을 다 쓴다. 세로는 곡 높이에 맞춘다
  const f={cell:16,bw:18,lineGap:24,unitGap:52,pad:0},L=layoutUnits(s.u,f),sh=Math.max(...L.cols.map(c=>c.len))*f.cell,kx=(w-20)/L.w,ky=(h-10)/sh,
    o={cell:f.cell*ky,bw:Math.min(f.bw*kx,f.bw*ky*1.6),lineGap:f.lineGap*kx,unitGap:f.unitGap*kx,pad:10},cols=layoutUnits(s.u,o).cols,X=10+p*(L.w*kx);
  // 지나간 곳은 색, 아직 오지 않은 곳은 옅게
  cols.forEach(c=>{nx.globalAlpha=c.x<=X?1:.16;drawCols(nx,[c],(h+sh*ky)/2,o);});nx.globalAlpha=1;
  nx.fillStyle=INK;nx.fillRect(Math.min(X,w-2),0,2,h);}

 'Bollywood':'Bollywood','빨간 나를':'Holiday','Put Me On Drugs':'Put me on drugs','하와이 검은 모래':'Hawaiian black sand','맑고 묽게':'Thinner than water',

 'Flying Bobs':'Flying Bobs','Baptized In Fire (불세례)':'Baptized In Fire','어린양 (My Little Lambs)':'어린양 - 검정치마','Sunday Girl':'Sunday Girl','Friends In Bed':'Friends In Bed',

 'Powder Blue':'Powder Blue','Electra':'Electra','Min (미는 남자)':'Min','Jeff & Alana':'Jeff And Alana','Ling Ling':'Ling Ling','John Fry':'John Fry',"'99%":'99%','Our Own Summer':'Our Own Summer'};
const musicSrc=s=>MUSIC_FILE[s.t]?encodeURI('file/music/'+MUSIC_DIR[s.al]+'/'+MUSIC_FILE[s.t]+'.mp3').replace(/#/g,'%23'):null;
// 재생: 음원이 있으면 소리와 함께 그 길이대로, 없으면 소리 없이 데이터 길이대로 (바늘은 앨범 안에서의 자리대로 안쪽으로)
let VOL=.8;try{const v=parseFloat(localStorage.getItem('gam-vol'));if(v>=0&&v<=1)VOL=v;}catch(e){}
$('vol').value=VOL;$('vol').oninput=e=>{VOL=+e.target.value;if(playing&&playing.pending)playing.pending.volume=VOL;try{localStorage.setItem('gam-vol',VOL)}catch(_){}};
function startSong(){const p=playing,s=p.list[p.idx];p.seg=performance.now();p.audio=null;const src=musicSrc(s);
  if(src){const a=new Audio(src);a.volume=VOL;a.onerror=()=>{if(p.audio===a){p.audio=null;p.seg=performance.now();}};a.play().then(()=>{if(playing===p)p.audio=a;else a.pause();}).catch(()=>{});p.pending=a;}}
function nextSong(){const p=playing;if(p.pending)p.pending.pause();p.cum+=durOf(p.list[p.idx]);p.idx++;if(p.idx>=p.list.length)stopPlay();else startSong();}
function startPlay(ai,only=null){if(playing&&playing.pending)playing.pending.pause();
  const songs=songsOf(ALB[ai]),list=only==null?songs:[only],total=songs.reduce((t,s)=>t+durOf(s),0);
  const off=only==null?0:songs.slice(0,songs.indexOf(only)).reduce((t,s)=>t+durOf(s),0);
  playing={ai,list,total,cum:off,idx:0,started:false,t0:performance.now()+1400};
  P.lpMat.map&&P.lpMat.map.dispose();P.lpMat.map=new THREE.CanvasTexture(lpCv[ai]);P.lpMat.map.colorSpace=THREE.SRGBColorSpace;P.lpMat.needsUpdate=true;
  P.disc.visible=true;P.disc.position.y=.16;P.discY=.0185;P.speed=Math.PI*2*33.3/60;P.armTo=ARM_OUT+(ARM_IN-ARM_OUT)*off/total;
  slots.forEach((s,n)=>{const d=s.querySelector('.lpv');if(d)d.classList.toggle('away',ITEMS[n].i===ai);}); // 판만 빠지고 슬리브는 남는다
  $('now').classList.add('on');}
function stopPlay(){if(!playing)return;if(playing.pending)playing.pending.pause();playing=null;P.armTo=0;P.speed=0;P.discY=.16;$('now').classList.remove('on');
  setTimeout(()=>{if(!playing){P.disc.visible=false;slots.forEach(s=>s.querySelector('.lpv')?.classList.remove('away'));}},700);}
function tickPlay(now){const p=playing;if(!p||now<p.t0)return; // 바늘이 내려앉은 뒤 시작
  if(!p.started){p.started=true;startSong();}
  const s=p.list[p.idx],a=p.audio;let r;

 const tex=c=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};
 const paperM=new THREE.MeshStandardMaterial({color:0xf3f0e9,roughness:.85});
 const S=1,H=.09,T=.006,mk=(w,h,d,mat,x,y,z,g)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o;};
 const tray=new THREE.Group();sc.add(tray);mk(S-.01,T,S-.01,paperM,0,T/2,0,tray);
 [[0,(S-.01)/2],[0,-(S-.01)/2]].forEach(([x,z])=>mk(S-.01,H-.01,T,paperM,x,(H-.01)/2,z,tray));[[(S-.01)/2,0],[-(S-.01)/2,0]].forEach(([x,z])=>mk(T,H-.01,S-.01,paperM,x,(H-.01)/2,z,tray));
 // 박스 안: 부클릿, 악보 모음집, LP (인터페이스와 같은 순서)

 const inBk=new THREE.Mesh(new THREE.BoxGeometry(.26,.012,.37),[paperM,paperM,flatM(coverCanvas),paperM,paperM,paperM]);inBk.position.set(-.3,T+.006,0);inBk.castShadow=true;tray.add(inBk);
 mk(.26,.06,.16,new THREE.MeshStandardMaterial({color:0xf4f1ea,roughness:.8}),0,T+.03,.05,tray);
 const inLp=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.004,96),[paperM,flatM(lpCv[0]),paperM]);inLp.position.set(.3,T+.002,0);inLp.castShadow=true;tray.add(inLp);
 const lid=new THREE.Group();sc.add(lid);

   c.fillStyle='#6f6962';c.font=`500 34px ${F}`;c.fillText('검정치마 3집',w/2,h-120);});
 mk(S,T,S,[paperM,paperM,new THREE.MeshStandardMaterial({map:tex(coverTex),roughness:.85}),paperM,paperM,paperM],0,H+T/2,0,lid);
 [[0,S/2-T/2,S,T],[0,-S/2+T/2,S,T],[S/2-T/2,0,T,S],[-S/2+T/2,0,T,S]].forEach(([x,z,w,d])=>mk(w,.04,d,paperM,x,H-.02,z,lid));
 const cam=new THREE.PerspectiveCamera(30,1,.01,20);cam.up.set(0,0,-1); // 위에서 내려다볼 때 화면 위쪽 = 박스 위쪽
 function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
   // 표지가 화면 높이를 거의 채우게
   const dist=(S*.5/.96)/Math.tan(cam.fov*Math.PI/360)/Math.min(1,cam.aspect);cam.position.set(0,dist+H,.0001);cam.lookAt(0,0,0);}
 fit();addEventListener('resize',fit);
 let t0=0,opening=false;const ez=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
 r.setAnimationLoop(now=>{if(opening){const t=Math.min(1,(now-t0)/2200);
     const a=ez(Math.min(1,t/.45)),b=ez(Math.max(0,(t-.3)/.7));
     lid.position.y=a*.35;lid.rotation.x=-b*.5;lid.position.z=-b*2.4;lid.position.x=b*.4;
     if(t>=.75&&!host.classList.contains('gone')){host.classList.add('gone');$('ui').classList.add('on');setTimeout(()=>{r.setAnimationLoop(null);host.remove();},1000);}}
   r.render(sc,cam);});
 const go=()=>{if(!qDone)return;if(!opening){opening=true;t0=performance.now();}};host.addEventListener('click',go);host.addEventListener('wheel',go,{passive:true});host.addEventListener('touchmove',go,{passive:true});
 addEventListener('keydown',e=>{if(qDone&&!opening&&['ArrowDown',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();go();}});}
