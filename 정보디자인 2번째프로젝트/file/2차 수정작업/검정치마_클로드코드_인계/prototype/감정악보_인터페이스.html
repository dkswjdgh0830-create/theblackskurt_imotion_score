<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감정악보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--paper:#fbfaf7;--ink:#161412;--mute:#a19a92;--line:#e6e1d9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans CJK KR",sans-serif}
section{min-height:100vh;position:relative}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:6vh 6vw}
/* 1 표지 */
#cover h1{font-size:clamp(56px,11vw,168px);font-weight:800;letter-spacing:-.04em;margin:0;line-height:1}
#cover .sub{margin-top:18px;color:var(--mute);font-size:15px;letter-spacing:.02em}
#cover .mark{margin-top:7vh;opacity:.95}
/* 2 읽는 법 */
#how{height:320vh}
#how .stick{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;gap:7vw;padding:0 6vw}
.pair{position:relative}
.sheetT{position:relative;padding:34px 40px;background:#fff}
.sheetT .ln{white-space:pre;font-size:clamp(22px,2.6vw,38px);line-height:1.6;font-weight:500}
.sheetT .bx{background-repeat:no-repeat;background-position:center;background-size:100% 78%;padding:0 2px;margin:0 -2px}
.sheetT .ph{display:inline-block;height:.18em;background:#d8d2c8;vertical-align:middle;border-radius:1px}
.vellum{position:absolute;inset:0;background:rgba(255,255,255,.62);backdrop-filter:blur(.6px);box-shadow:0 6px 24px #0001;transform-origin:left center;will-change:transform}
.vellum .ln{color:transparent}.vellum .ph{background:transparent}
.key{opacity:0;transition:opacity .6s}
.key.on{opacity:1}
.key table{border-collapse:separate;border-spacing:3px}
.key td{width:44px;height:26px}
.key .ax{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;margin-top:6px}
.key .ay{font-size:12px;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;height:88px;margin-right:6px}
.key .row{display:flex;align-items:flex-start}
/* 3 한 곡 */
#one .t{font-size:14px;color:var(--mute);margin-bottom:22px;letter-spacing:.02em}
/* 4 세 앨범 */
#three{padding:10vh 4vw}
.alb{margin:0 0 7vh}
.alb .nm{font-size:13px;color:var(--mute);margin:0 0 10px;letter-spacing:.06em}
.alb svg{display:block;overflow:visible}
.alb .hit{fill:transparent;cursor:pointer}
.alb .hit:hover{fill:rgba(0,0,0,.035)}
#tip{position:fixed;pointer-events:none;font-size:13px;background:var(--ink);color:#fff;padding:4px 8px;opacity:0;transition:opacity .15s;z-index:20}
/* 5 곡 열기 */
#detail{position:fixed;inset:0;background:rgba(251,250,247,.97);display:none;z-index:10;overflow:auto}
#detail.on{display:block}
#detail .in{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 4vw;gap:28px}
#detail .t{font-size:15px;color:var(--mute)}
#detail .x{position:fixed;top:18px;right:24px;font-size:26px;cursor:pointer;color:var(--mute);background:none;border:0}
#detail .tg{font:inherit;font-size:13px;border:1px solid var(--ink);background:none;padding:6px 14px;cursor:pointer}
/* 가사 넣기 (작업용) */
#lyrBtn{position:fixed;right:14px;bottom:12px;font:12px Pretendard;color:var(--mute);background:none;border:0;cursor:pointer;z-index:30}
#lyrPanel{position:fixed;right:14px;bottom:40px;width:340px;background:#fff;border:1px solid var(--line);padding:12px;display:none;z-index:30;font-size:12px}
#lyrPanel textarea{width:100%;height:240px;font:12px/1.5 Pretendard}
#lyrPanel button{font:inherit;margin-top:6px;border:1px solid var(--ink);background:none;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>

<section id="cover"><div class="center"><h1>감정악보</h1><div class="sub">검정치마 3집</div><div class="mark" id="coverMark"></div></div></section>

<section id="how"><div class="stick">
  <div class="pair" id="howPair"></div>
  <div class="key" id="key"></div>
</div></section>

<section id="one"><div class="center"><div class="t">Big Love</div><div id="oneScore"></div></div></section>

<section id="three"><div id="albums"></div></section>

<div id="tip"></div>
<div id="detail"><button class="x" id="dx">×</button><div class="in"><div class="t" id="dt"></div><div id="ds"></div><button class="tg" id="dtg" style="display:none">가사와 겹쳐 보기</button><div id="dl"></div></div></div>

<button id="lyrBtn">가사</button>
<div id="lyrPanel">

  <textarea id="lyrIn"></textarea><button id="lyrGo">적용</button>
</div>

const SONGS=D.songs, HAND=D.bigloveHand;
// 색: 색상 = 주제, 태도 = 어둡고 탁하게(1)~원색(5), 강조 수 = 연하게(0)~원색(2+)
function _lin(L,C,h){const A=C*Math.cos(h*Math.PI/180),B=C*Math.sin(h*Math.PI/180);const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
const _inG=v=>v.every(x=>x>=-1e-4&&x<=1+1e-4);
function _maxC(L,h){let c=0;while(c<.4&&_inG(_lin(L,c+.002,h)))c+=.002;return c;}
const _hex=v=>'#'+v.map(x=>{x=Math.max(0,Math.min(1,x));return Math.round(255*(x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055)).toString(16).padStart(2,'0')}).join('');
const TOPIC={L:[27,1],F:[150,.75],S:[255,.75],H:[85,.75],W:[320,.75]};const _CC={},_PK={};
function colOf(k,a,e){const key=k+a+e;if(_CC[key])return _CC[key];const[h,cap]=TOPIC[k]||TOPIC.L;
 if(!_PK[k]){let pL=.4,pC=0;for(let q=.4;q<=.8;q+=.005){const m=_maxC(q,h);if(m>pC){pC=m;pL=q;}}_PK[k]=[pL,pC*cap];}const[pL,pC]=_PK[k];
 const d=(5-a)/4;let L=pL-(pL-.27)*d,C=pC*(1-.7*d);const w=[.62,.32,0][Math.min(e,2)]*(1-.55*d);L=L+(.94-L)*w;C=Math.min(C*(1-w),_maxC(L,h));
 return _CC[key]={c:_hex(_lin(L,C,h)),dark:L<.55};}

// 악보 그리기: 줄 하나 = 세로 기둥 하나, 아래에서 위로 읽음. 박스만 그림
const SP=.35;
function layoutUnits(units,o){const cols=[];let x=o.pad;
 units.forEach((u,ui)=>{u.w.forEach((ws,li)=>{let off=0;const st=[];ws.forEach(w=>{st.push(off);off+=w+SP;});
   const boxes=(u.b[li]||[]).map(([a,b])=>({y0:st[a],y1:st[b]+ws[b],c:colOf(u.k||'L',u.a,u.e).c}));
   cols.push({x,len:off-SP,boxes});x+=o.lineGap;});x+=o.unitGap-o.lineGap;});
 return {cols,w:x-o.unitGap+o.lineGap+o.pad};}
function svgOf(cols,W,H,o,extra=''){let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
 cols.forEach(c=>c.boxes.forEach(b=>{s+=`<rect x="${(c.x-o.bw/2).toFixed(1)}" y="${(H-o.pad-b.y1*o.cell).toFixed(1)}" width="${o.bw}" height="${((b.y1-b.y0)*o.cell).toFixed(1)}" fill="${b.c}"/>`;}));
 return s+extra+'</svg>';}
function songSVG(units,o){const L=layoutUnits(units,o);const maxLen=Math.max(...L.cols.map(c=>c.len));const H=maxLen*o.cell+o.pad*2;return {svg:svgOf(L.cols,L.w,H,o),w:L.w,h:H};}

// 1 표지: Big Love 마크
document.getElementById('coverMark').innerHTML=songSVG(HAND,{cell:6,bw:7,lineGap:9,unitGap:20,pad:4}).svg;

// 3 한 곡
function fitOne(){const vw=innerWidth*.86;const base=songSVG(HAND,{cell:16,bw:18,lineGap:24,unitGap:52,pad:10});const s=Math.min(1,vw/base.w);
 document.getElementById('oneScore').innerHTML=songSVG(HAND,{cell:16*s,bw:18*s,lineGap:24*s,unitGap:52*s,pad:10}).svg;}

// 4 세 앨범: 곡을 이어 붙여 한 줄. 세 줄 모두 같은 축척
const ALB=['TEAM BABY','THIRSTY','TEEN TROUBLES'];
function drawAlbums(){const box=document.getElementById('albums');box.innerHTML='';
 // 악보처럼 줄을 바꿔 이어 씀. 세 앨범 모두 같은 축척
 const maxW=innerWidth*.92;const o={cell:4.2,bw:4.6,lineGap:6.4,unitGap:11,songGap:30,pad:4};
 const maxLen=Math.max(...SONGS.flatMap(s=>s.u.flatMap(u=>u.w.map(ws=>ws.reduce((x,y)=>x+y+SP,0)-SP))));const H=maxLen*o.cell+o.pad*2;
 ALB.forEach(al=>{const d=document.createElement('div');d.className='alb';d.innerHTML=`<div class="nm">${al}</div>`;
  let staff=[],x=o.pad;const staves=[staff];
  SONGS.filter(s=>s.al===al).forEach(s=>{const L=layoutUnits(s.u,{...o,pad:0});
   if(x+L.w>maxW&&staff.length){staff=[];staves.push(staff);x=o.pad;}
   staff.push({s,x0:x,cols:L.cols.map(c=>({...c,x:c.x+x})),w:L.w});x+=L.w+o.songGap;});
  staves.forEach(st=>{const cols=st.flatMap(g=>g.cols);let hits='';
   st.forEach(g=>{hits+=`<rect class="hit" data-i="${SONGS.indexOf(g.s)}" x="${g.x0-6}" y="0" width="${g.w+12}" height="${H}"/>`;});
   const wrap=document.createElement('div');wrap.style.marginBottom='18px';wrap.innerHTML=svgOf(cols,maxW,H,o,hits);d.appendChild(wrap);});
  box.appendChild(d);});
 box.querySelectorAll('.hit').forEach(h=>{const s=SONGS[+h.dataset.i];
  h.onmousemove=e=>{tip.textContent=`${s.tr}. ${s.t}`;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.style.opacity=1;};
  h.onmouseleave=()=>tip.style.opacity=0;h.onclick=()=>openSong(s.t,s.u);});}
const tip=document.getElementById('tip');

// 가사 (작업용, 메모리에만)
const LYR={};
function parseLyr(t){t.replace(/\r/g,'').split(/^#\s*/m).filter(Boolean).forEach(b=>{const i=b.indexOf('\n');const name=b.slice(0,i).trim();const units=b.slice(i+1).trim().split(/\n[ \t]*\n+/).map(u=>u.split('\n').map(x=>x.trim()).filter(Boolean));LYR[name.toLowerCase()]=units;});}
function lyrFor(t){const k=t.toLowerCase();return LYR[k]||Object.entries(LYR).find(([n])=>k.startsWith(n)||n.startsWith(k))?.[1];}

// 가사 시트 (가로, 박스는 글자에 붙음)
function textSheet(units,lyr,from,to){const s=document.createElement('div');s.className='sheetT';
 for(let ui=from;ui<to;ui++){const u=units[ui];const lines=lyr?lyr[ui]:null;
  u.w.forEach((ws,li)=>{const L=document.createElement('div');L.className='ln';const words=lines?lines[li].split(/\s+/):null;const bx=u.b[li]||[];const col=colOf(u.k||'L',u.a,u.e);
   let i=0;while(i<ws.length){const r=bx.find(([a])=>a===i);const end=r?r[1]:i;
    const sp=document.createElement('span');
    if(words)sp.textContent=words.slice(i,end+1).join(' ');else{for(let j=i;j<=end;j++){const p=document.createElement('span');p.className='ph';p.style.width=ws[j]+'em';sp.appendChild(p);if(j<end)sp.appendChild(document.createTextNode(' '));}}
    if(r){sp.className='bx';sp.dataset.c=col.c;sp.dataset.dark=col.dark?1:0;}
    L.appendChild(sp);i=end+1;if(i<ws.length)L.appendChild(document.createTextNode(' '));}
   s.appendChild(L);});
  if(ui<to-1){const g=document.createElement('div');g.style.height='.7em';s.appendChild(g);}}
 return s;}
function pairOf(units,lyr,from,to){const wrap=document.createElement('div');wrap.className='pair';
 const back=textSheet(units,lyr,from,to);const front=textSheet(units,lyr,from,to);front.classList.add('vellum');front.style.position='absolute';front.style.inset='0';
 front.querySelectorAll('.bx').forEach(b=>{b.style.backgroundImage=`linear-gradient(${b.dataset.c},${b.dataset.c})`;});
 wrap.appendChild(back);wrap.appendChild(front);wrap._front=front;return wrap;}

// 2 읽는 법: 스크롤하면 트레이싱지가 덮이고, 다 덮이면 색표가 나옴
let howPair;
function buildHow(){const host=document.getElementById('howPair');host.innerHTML='';const lyr=lyrFor('Big Love');howPair=pairOf(HAND,lyr,4,6);host.appendChild(howPair);onScroll();}
function buildKey(){const k=document.getElementById('key');let t='<div class="row"><div class="ay"><span>덤덤</span><span>세게</span></div><div><table>';
 for(const e of [2,1,0]){t+='<tr>';for(let a=1;a<=5;a++)t+=`<td style="background:${colOf('L',a,e).c}"></td>`;t+='</tr>';}
 t+='</table><div class="ax"><span>이별</span><span>확신</span></div></div></div>';k.innerHTML=t;}
function onScroll(){const sec=document.getElementById('how');const r=sec.getBoundingClientRect();const p=Math.max(0,Math.min(1,-r.top/(sec.offsetHeight-innerHeight)));
 if(howPair){const f=howPair._front;const cover=Math.min(1,p/0.45);f.style.transform=`translateX(${(1-cover)*110}%)`;f.style.opacity=cover<0.02?0:1;}
 document.getElementById('key').classList.toggle('on',p>0.55);}
addEventListener('scroll',onScroll,{passive:true});

// 5 곡 열기
const det=document.getElementById('detail');
function openSong(t,units){document.getElementById('dt').textContent=t;const base=songSVG(units,{cell:12,bw:13,lineGap:18,unitGap:36,pad:8});const s=Math.min(1,innerWidth*.9/base.w);
 document.getElementById('ds').innerHTML=songSVG(units,{cell:12*s,bw:13*s,lineGap:18*s,unitGap:36*s,pad:8}).svg;
 const lyr=lyrFor(t);const tg=document.getElementById('dtg');const dl=document.getElementById('dl');dl.innerHTML='';
 if(lyr&&lyr.length===units.length){tg.style.display='';tg.onclick=()=>{if(dl.innerHTML){dl.innerHTML='';return;}const pr=pairOf(units,lyr,0,units.length);pr._front.style.transition='transform .9s';pr._front.style.transform='translateX(110%)';dl.appendChild(pr);requestAnimationFrame(()=>requestAnimationFrame(()=>pr._front.style.transform='none'));pr._front.onclick=()=>{pr._front.style.transform=pr._front.style.transform==='none'?'translateX(110%)':'none';};};}
 else tg.style.display='none';
 det.classList.add('on');}
document.getElementById('dx').onclick=()=>det.classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')det.classList.remove('on');});
document.getElementById('oneScore').onclick=()=>openSong('Big Love',HAND);document.getElementById('oneScore').style.cursor='pointer';

// 가사 패널
document.getElementById('lyrBtn').onclick=()=>{const p=document.getElementById('lyrPanel');p.style.display=p.style.display==='block'?'none':'block';};
document.getElementById('lyrGo').onclick=()=>{parseLyr(document.getElementById('lyrIn').value);buildHow();document.getElementById('lyrPanel').style.display='none';};

function all(){buildHow();buildKey();fitOne();drawAlbums();}
addEventListener('resize',()=>{fitOne();drawAlbums();});
(document.fonts?document.fonts.ready:Promise.resolve()).then(all);all();
</script>
