<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>박스 겹쳐 읽기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap">
<style>
:root{--paper:#fff;--ink:#111;--mute:#999}
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Pretendard,"Noto Sans CJK KR",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 280px;min-height:100vh}
.stage{overflow:auto;padding:40px;display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.sheet{background:var(--paper);padding:48px 56px;position:relative;box-shadow:0 1px 3px #0002}
.unit{margin:0 0 var(--ug,30px)}
.line{position:relative;white-space:pre;font-family:var(--ff,Pretendard),"Noto Sans CJK KR",sans-serif;font-weight:var(--fw,500);font-size:var(--fs,30px);line-height:var(--lh,1.45);letter-spacing:var(--ls,0);font-weight:500;color:var(--ink)}
.box{background-repeat:no-repeat;background-position:center;background-size:100% var(--bh,76%);padding:0 var(--bp,2px);margin:0 calc(-1 * var(--bp,2px))}
.free{position:absolute;cursor:move;white-space:pre;line-height:1.2;outline:none;z-index:5}.free.sel{box-shadow:0 0 0 1px #2b6cb0}.free[contenteditable=true]{cursor:text}
.front .line{color:transparent}.back .box{background-image:none!important}
.sheet.h2,.sheet.h1{display:flex;align-items:flex-start;width:max-content}
.sheet.h2 .unit{margin:0 var(--ug,30px) 0 0}
.sheet.h1 .unit{margin:0 var(--ug,30px) 0 0;display:flex;gap:.6em}
.stage.wide{flex-direction:column}
.rotw{position:relative;flex:none}.rotw>*{position:absolute!important;left:0;top:0}
.stack{position:relative;perspective:2400px}
.stack .front{position:absolute;left:0;top:0;transform-origin:left center;transform:translateX(var(--slide,0px)) rotateY(var(--flip,0deg));background:rgba(255,255,255,var(--paper,.55));backdrop-filter:blur(var(--blur,0px));box-shadow:0 2px 10px #0003;transition:transform .05s;cursor:grab}
.stack .front .line{color:transparent}
aside{background:#f6f6f6;border-left:1px solid #ddd;padding:20px;font-size:13px;position:sticky;top:0;height:100vh;overflow:auto}
aside textarea{width:100%;height:260px;font:12px/1.5 inherit}aside label{display:block;margin:12px 0 4px;color:#555}aside input[type=range]{width:100%}
aside button{margin:6px 4px 0 0;padding:6px 10px;border:1px solid #111;background:none;cursor:pointer;font:inherit}
.hint{color:var(--mute);font-size:11px;line-height:1.5}
</style></head><body>
<div class="wrap"><main class="stage" id="stage"><div class="hint">오른쪽에 가사를 붙여 넣어 주세요. 의미 단위 사이에 빈 줄 하나. 가사는 저장되지 않습니다.</div></main>
<aside>
<b>곡</b><select id="song" style="width:100%"></select>
<b style="display:block;margin-top:10px">가사</b><textarea id="lyr"></textarea><button id="go">적용</button>
<label>보기</label><button data-m="front">앞장 (박스만)</button><button data-m="back">뒷장 (가사만)</button><button data-m="over">겹쳐 보기</button><button data-m="all">셋 다</button>
<label>배치</label><select id="lay"><option value="v">세로 (단위가 아래로)</option><option value="h2">가로, 두 줄 (단위가 옆으로)</option><option value="h1">가로, 한 줄 (곡 전체가 한 줄)</option></select>
<label>회전</label><select id="rot"><option value="0">0°</option><option value="-90">90° (시간이 왼쪽에서 오른쪽)</option><option value="90">-90°</option></select>
<label>글자 크기 <span id="fsv"></span></label><input id="fs" type="range" min="16" max="48" value="30">
<label>줄 간격 <span id="lhv"></span></label><input id="lh" type="range" min="100" max="260" value="145">
<label>자간 (박스 길이) <span id="lsv"></span></label><input id="ls" type="range" min="-10" max="40" value="0">
<label>박스 좌우 여유 px</label><input id="bp" type="range" min="-4" max="16" value="2">
<label>단위 사이 간격</label><input id="ug" type="range" min="0" max="80" value="30">
<label>박스 높이 %</label><input id="bh" type="range" min="30" max="100" value="76">
<b style="display:block;margin-top:18px">글꼴</b>
<label>가사 글꼴</label><select id="ff"></select>
<input id="ffc" placeholder="다른 글꼴 이름 직접 입력 (설치된 글꼴)" style="width:100%;margin-top:4px">
<label>굵기</label><select id="fw"><option>300</option><option>400</option><option selected>500</option><option>600</option><option>700</option><option>800</option><option>900</option></select>
<b style="display:block;margin-top:18px">겹쳐 보기</b>
<label>트레이싱지 넘기기 <span id="flv"></span></label><input id="flip" type="range" min="0" max="170" value="0">
<label>트레이싱지 옆으로 밀기</label><input id="slide" type="range" min="0" max="700" value="0">
<label>종이 불투명도 (비침)</label><input id="paper" type="range" min="0" max="95" value="55">
<label>종이 흐림</label><input id="blur" type="range" min="0" max="6" value="0">
<label>박스 불투명도</label><input id="bo" type="range" min="10" max="100" value="100">
<div class="hint">겹쳐 보기에서 트레이싱지를 끌어서 넘길 수도 있습니다.</div>
<b style="display:block;margin-top:18px">글자 넣기</b>
<button id="addT">글자 추가</button><button id="delT">고른 글자 지우기</button>
<label>고른 글자 크기 <span id="tsv"></span></label><input id="ts" type="range" min="8" max="120" value="24">
<label>고른 글자 글꼴</label><select id="tf"></select>
<label>고른 글자 색</label><input id="tc" type="color" value="#111111">
<div class="hint">글자를 끌어서 옮기고, 두 번 눌러서 고칩니다. 앞장에 올라갑니다.</div>
<b style="display:block;margin-top:18px">내보내기</b><button id="svg">앞장 SVG 저장</button>
<div class="hint" style="margin-top:14px">박스 데이터는 아래 BOX에 있습니다. 단위마다 태도, 강조 표현 수, 줄별 [시작 어절, 끝 어절] 번호.</div>
</aside></div>

 const ms=MODE==='all'?['front','back','over']:[MODE];let first=null;ms.forEach(m=>{if(m==='over'){const w=document.createElement('div');w.className='stack';w.appendChild(sheet('back'));const f=sheet('front');w.appendChild(f);put(st,w);dragFlip(f);if(!first)first=f;else FREE.forEach(t=>f.appendChild(t.el.cloneNode(true)));}
 else{const sh=sheet(m);put(st,sh);if(m==='front'&&!first)first=sh;}});
 if(first)FREE.forEach(t=>first.appendChild(t.el));}
function put(st,el){const r=+$('rot').value;if(!r){st.appendChild(el);return;}
 const w=document.createElement('div');w.className='rotw';st.appendChild(w);w.appendChild(el);const W=el.offsetWidth,H=el.offsetHeight;
 w.style.width=H+'px';w.style.height=W+'px';el.style.transformOrigin='0 0';el.style.transform=r<0?`translateY(${W}px) rotate(-90deg)`:`translateX(${H}px) rotate(90deg)`;}
function dragFlip(f){f.addEventListener('mousedown',e=>{if(e.target.classList.contains('free'))return;e.preventDefault();const sx=e.clientX,v0=+$('flip').value,W=f.offsetWidth;
 const mv=ev=>{const d=(sx-ev.clientX)/W*180;$('flip').value=Math.max(0,Math.min(170,v0+d));render();};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);});}
// 자유 글자
let FREE=[],SELT=null;
function frontSheet(){return FREE.length&&FREE[0].el.parentNode?FREE[0].el.parentNode:document.querySelector('.sheet.front');}
function mkText(){const el=document.createElement('div');el.className='free';el.textContent='글자';el.style.left='60px';el.style.top='20px';el.style.fontSize='24px';el.style.color='#111111';el.style.fontFamily='Pretendard';el.style.fontWeight='600';
 const t={el};el.addEventListener('mousedown',e=>{if(el.isContentEditable)return;e.preventDefault();selT(t);const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
  const mv=ev=>{el.style.left=ox+ev.clientX-sx+'px';el.style.top=oy+ev.clientY-sy+'px';};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);});
 el.addEventListener('dblclick',()=>{el.contentEditable='true';el.focus();});el.addEventListener('blur',()=>{el.contentEditable='false';});
 return t;}
function selT(t){FREE.forEach(f=>f.el.classList.remove('sel'));SELT=t;if(t){t.el.classList.add('sel');$('ts').value=parseInt(t.el.style.fontSize);$('tsv').textContent=$('ts').value;$('tf').value=t.el.style.fontFamily.replace(/"/g,'');$('tc').value=t.el.style.color.startsWith('#')?t.el.style.color:rgb2hex(t.el.style.color);}}
function rgb2hex(c){const m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#111111';}
$('addT').onclick=()=>{if(!frontSheet()){alert('먼저 가사를 적용하고 앞장이 보이게 해 주세요');return;}const t=mkText();FREE.push(t);frontSheet().appendChild(t.el);selT(t);};
$('delT').onclick=()=>{if(!SELT)return;SELT.el.remove();FREE=FREE.filter(f=>f!==SELT);SELT=null;};
$('ts').oninput=()=>{$('tsv').textContent=$('ts').value;if(SELT)SELT.el.style.fontSize=$('ts').value+'px';};
$('tc').oninput=()=>{if(SELT)SELT.el.style.color=$('tc').value;};
$('tf').onchange=()=>{if(SELT)SELT.el.style.fontFamily=`"${$('tf').value}"`;};
// 앞장 SVG: 박스 사각형과 넣은 글자만 (가사는 들어가지 않음)
$('svg').onclick=()=>{const f=frontSheet();if(!f)return;const R=f.getBoundingClientRect();const bh=$('bh').value/100;let o='';
 f.querySelectorAll('.box').forEach(b=>{const cs=getComputedStyle(b);const col=cs.backgroundImage.match(/rgba?\([^)]*\)/)[0];[...b.getClientRects()].forEach(r=>{const h=r.height*bh;o+=`<rect x="${(r.left-R.left).toFixed(1)}" y="${(r.top-R.top+(r.height-h)/2).toFixed(1)}" width="${r.width.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;});});
 FREE.forEach(t=>{const r=t.el.getBoundingClientRect();o+=`<text x="${(r.left-R.left).toFixed(1)}" y="${(r.top-R.top+parseFloat(t.el.style.fontSize)).toFixed(1)}" font-size="${t.el.style.fontSize}" fill="${t.el.style.color}" font-family="${t.el.style.fontFamily.replace(/"/g,'')}" font-weight="${t.el.style.fontWeight}">${t.el.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;});
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${R.width}" height="${R.height}" viewBox="0 0 ${R.width} ${R.height}"><rect width="100%" height="100%" fill="#fff"/>${o}</svg>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='앞장_박스.svg';a.click();};
$('go').onclick=()=>{UNITS=parse($('lyr').value);render();};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;render();});
DATA.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${d.al} ${d.tr}. ${d.t}`;$('song').appendChild(o);});
$('song').onchange=()=>{BOX=DATA[+$('song').value].u;if($('lyr').value.trim()){UNITS=parse($('lyr').value);}render();};
const FONTS=['Pretendard','IBM Plex Sans KR','Noto Sans KR','Noto Serif KR','Gowun Batang','Gowun Dodum','Nanum Myeongjo'];
['ff','tf'].forEach(id=>FONTS.forEach(f=>{const o=document.createElement('option');o.textContent=f;$(id).appendChild(o);}));
['ff','fw','lay','rot'].forEach(id=>$(id).onchange=render);$('ffc').oninput=render;
document.fonts&&document.fonts.ready.then(render);
document.querySelectorAll('aside input[type=range]').forEach(i=>{if(i.id!=='ts')i.oninput=render;});render();
</script></body></html>
