<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부클릿 타이포 실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400&display=swap">
<style>
/* 부클릿 한 장: 가사 한 단위 = 한 줄. 색, 크기, 글꼴이 데이터 */
:root{
  --paper:#f4efe6; --ink:#2b2520; --mute:#9a8f84; --line:#ddd3c4;
  --sans:"IBM Plex Sans KR",sans-serif; --serif:"Gowun Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100vh}
.page{padding:72px 80px 120px;min-width:0}
h1{font-family:var(--serif);font-weight:700;font-size:44px;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 56px}
.sec{color:var(--mute);font-size:12px;letter-spacing:.08em;margin:36px 0 10px}
.unit{display:flex;align-items:baseline;gap:14px;margin:0 0 var(--gap,14px)}
.no{color:var(--mute);font-size:11px;width:26px;flex:none;text-align:right;font-family:var(--sans)}
.rep{display:inline-block;border:1px solid var(--mute);border-radius:50%;width:16px;height:16px;line-height:14px;text-align:center;font-size:9px;margin-left:4px}
.txt{line-height:1.35;word-break:keep-all}
.m-약속{font-family:var(--serif);font-weight:700}
.m-몸{font-family:"Black Han Sans",var(--sans)}
.m-기억{font-family:"Nanum Myeongjo",serif;display:inline-block;transform:skewX(-8deg)}
.m-그외{font-family:var(--sans)}
.empty{color:var(--mute);border:1px dashed var(--line);padding:28px;font-size:14px;line-height:1.7}
aside{border-left:1px solid var(--line);padding:24px 20px;position:sticky;top:0;height:100vh;overflow:auto;background:#efe8dc;font-size:13px}
aside h2{font-size:14px;margin:0 0 12px}
aside label{display:block;margin:14px 0 4px;color:#5f564d}
aside input[type=range]{width:100%}
aside textarea{width:100%;height:220px;font:12px/1.5 var(--sans);background:#fbf8f2;border:1px solid var(--line);padding:8px}
aside .hint{color:var(--mute);font-size:11px;line-height:1.5;margin-top:4px}
aside button{font:inherit;padding:6px 10px;border:1px solid var(--ink);background:none;cursor:pointer;margin-top:8px}
output{float:right;color:var(--mute)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}.page{padding:40px 20px}}
</style>
</head>
<body>
<div class="wrap">
  <main class="page">
    <h1 id="title">Big Love</h1>
    <p class="sub">TEAM BABY 2번 트랙</p>
    <div id="sheet"><div class="empty">오른쪽 칸에 가사를 붙여 넣어 주세요. 한 줄에 의미 단위 하나씩, 16줄.<br>가사는 이 파일에 저장되지 않고, 이 화면에서만 쓰입니다.</div></div>
  </main>
  <aside>
    <h2>가사 넣기</h2>
    <textarea id="lyr" placeholder="한 줄에 의미 단위 하나씩"></textarea>
    <button id="go">적용</button>
    <div class="hint">줄 수가 태그 수(16)와 같아야 합니다.</div>

    <h2 style="margin-top:28px">조정</h2>
    <label>세기 1 글자 크기 <output></output></label><input id="s1" type="range" min="12" max="40" value="18">
    <label>세기 2 글자 크기 <output></output></label><input id="s2" type="range" min="12" max="48" value="24">
    <label>세기 3 글자 크기 <output></output></label><input id="s3" type="range" min="14" max="64" value="34">
    <label>밝기 범위: 가장 어두움 <output></output></label><input id="lmin" type="range" min="20" max="60" value="34">
    <label>밝기 범위: 가장 밝음 <output></output></label><input id="lmax" type="range" min="50" max="90" value="74">
    <label>색 진하기 <output></output></label><input id="chr" type="range" min="0" max="20" value="13">
    <label>기억: 흐림 정도 <output></output></label><input id="mblur" type="range" min="0" max="30" value="8">
    <label>기억: 비침 정도 <output></output></label><input id="mop" type="range" min="20" max="100" value="55">
    <label>몸: 거친 정도 <output></output></label><input id="rough" type="range" min="0" max="30" value="10">
    <label>줄 간격 <output></output></label><input id="gap" type="range" min="0" max="40" value="14">
    <label>반복 단위 들여쓰기 <output></output></label><input id="ind" type="range" min="0" max="120" value="40">
    <button id="copy">지금 값 복사</button>
  </aside>
</div>
<script>
// Big Love 16개 의미 단위의 태그 (가사는 넣지 않음)
// [주제, 태도 1~5, 세기 1~3, 말하는 방식, 구조, 다시 부르는 단위]
const TAGS=[
 ['L',5,3,'그외','벌스',0],['L',4,3,'그외','',0],['L',4,3,'약속','',0],['L',5,2,'기억','',0],
 ['L',5,3,'약속','후렴',0],['L',4,3,'약속','',0],
 ['L',5,3,'그외','벌스',0],['L',5,3,'기억','',0],
 ['L',5,3,'약속','후렴',5],['L',4,3,'약속','',6],
 ['L',5,3,'그외','브리지',0],['L',5,3,'그외','',0],
 ['L',5,3,'약속','아웃트로',5],['L',5,3,'약속','',5],['L',4,2,'그외','',6],['L',5,3,'약속','',6]
];
const HUE={L:28,F:140,S:248,H:72,W:335}, CF={L:1,F:.6,S:.6,H:.8,W:.65};
function oklch(L,C,h){const A=C*Math.cos(h*Math.PI/180),B=C*Math.sin(h*Math.PI/180);
 const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;
 return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s]
  .map(x=>{x=Math.max(0,Math.min(1,x));return Math.round(255*(x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055))});}
const $=id=>document.getElementById(id);
const V=()=>Object.fromEntries(['s1','s2','s3','lmin','lmax','chr','mblur','mop','rough','gap','ind'].map(k=>[k,+$(k).value]));
let LINES=[];
function color(t,v){const L=(v.lmin+(v.lmax-v.lmin)*(t[1]-1)/4)/100;const[r,g,b]=oklch(L,v.chr/100*CF[t[0]],HUE[t[0]]);return `rgb(${r},${g},${b})`;}
function render(){const v=V();document.querySelectorAll('aside label').forEach(l=>{const i=l.nextElementSibling;if(i&&i.type==='range')l.querySelector('output').textContent=i.value;});
 if(!LINES.length)return;
 if(LINES.length!==TAGS.length){$('sheet').innerHTML=`<div class="empty">줄 수가 ${LINES.length}줄입니다. 태그는 ${TAGS.length}개라서 맞춰야 합니다.</div>`;return;}
 const sheet=$('sheet');sheet.innerHTML='';sheet.style.setProperty('--gap',v.gap+'px');
 TAGS.forEach((t,i)=>{
  if(t[4]){const s=document.createElement('div');s.className='sec';s.textContent=t[4];sheet.appendChild(s);}
  const row=document.createElement('div');row.className='unit';if(t[5])row.style.paddingLeft=v.ind+'px';
  const no=document.createElement('span');no.className='no';no.textContent=i+1;row.appendChild(no);
  const tx=document.createElement('span');tx.className='txt m-'+t[3];tx.textContent=LINES[i];
  const size=[0,v.s1,v.s2,v.s3][t[2]];tx.style.fontSize=size+'px';tx.style.color=color(t,v);
  if(t[3]==='그외')tx.style.fontWeight=[0,300,500,700][t[2]];
  if(t[3]==='기억'){tx.style.opacity=v.mop/100;tx.style.filter=`blur(${v.mblur/10}px)`;}
  if(t[3]==='몸'){const r=v.rough/10;tx.style.textShadow=`${r}px 0 0 ${color(t,v)}, -${r*.6}px ${r*.5}px 0 ${color(t,v)}, 0 -${r*.4}px 0 ${color(t,v)}`;}
  row.appendChild(tx);
  if(t[5]){const rp=document.createElement('span');rp.className='rep';rp.textContent=t[5];rp.title=t[5]+'번 단위를 다시 부름';no.appendChild(rp);}
  sheet.appendChild(row);});}
$('go').onclick=()=>{LINES=$('lyr').value.split('\n').map(s=>s.trim()).filter(Boolean);render();};
document.querySelectorAll('aside input').forEach(i=>i.addEventListener('input',render));
$('copy').onclick=()=>{const t=JSON.stringify(V());(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{});$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='지금 값 복사',1500);};
render();
</script>
</body>
</html>
