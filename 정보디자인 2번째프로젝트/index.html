<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감정악보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 첫 화면은 3D 앨범 박스, 열면 평면 인터페이스. 인터페이스에서는 카메라가 움직이지 않고 물건이 눈앞으로 나온다 */
:root{--wall:#efede9;--ink:#161412;--sub:#a19a92;--paper:#fbf9f4;--ease:cubic-bezier(.2,.7,.2,1)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--ink)}
/* 첫 화면: 검정 바탕에 질문이 한 줄씩. 스크롤하면 미색으로 밝아지며 제목(앨범 박스 표지)이 나온다 */
#q{position:fixed;inset:0;z-index:25;background:#141210;color:#EDE8E0;display:flex;align-items:center;justify-content:center;transition:background 1.2s,opacity .9s .5s}
#q.lift{background:#F3EFE8;opacity:0;pointer-events:none}
#q .in{transition:opacity .6s}#q.lift .in{opacity:0}
#q p{margin:0;font-size:2.3vh;line-height:1.9;opacity:0;animation:qin 1s var(--ease) forwards}
#q p.big{font-size:3.1vh;font-weight:600}#q p.gap{height:2.6vh}
#q canvas{position:absolute;left:50%;bottom:-3vh;transform:translateX(-50%);height:12vh;opacity:0;animation:qin 1.4s 5.4s forwards}
@keyframes qin{from{opacity:0;transform:translateY(.6vh)}to{opacity:1;transform:none}}
#q canvas{animation-name:qfade}@keyframes qfade{to{opacity:1}}
#intro{position:fixed;inset:0;z-index:20;transition:opacity .9s}
#intro.gone{opacity:0;pointer-events:none}
#intro canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;opacity:0;transition:opacity .9s}
#ui.on{opacity:1}

/* 앨범 구성물: 같은 크기로 한 줄. 가운데 하나만 선택 카드 안에 들어가고 이름이 붙는다. 아래는 플레이어 */
:root{--V:26vh;--step:38vh}
#frame{position:absolute;left:50%;top:6vh;width:calc(var(--V) + 8vh);height:calc(var(--V) + 15vh);transform:translateX(-50%);border-radius:2.2vh;
  background:rgba(255,255,255,.5);border:1px solid rgba(22,20,18,.07);box-shadow:0 2px 10px rgba(40,30,20,.04);pointer-events:none}
#frame .ic{position:absolute;right:1.6vh;top:1.6vh;width:2.8vh;height:2.8vh;border-radius:50%;border:1px solid rgba(22,20,18,.14);display:flex;align-items:center;justify-content:center}
#frame .ic svg{width:1.2vh;height:1.2vh}
.meta .sub{font-size:1.3vh;color:var(--sub);font-weight:500;line-height:1.4}
.meta .ttl{font-size:1.75vh;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame .meta{position:absolute;left:4vh;right:4vh;bottom:2.8vh}
.slot{position:absolute;left:50%;top:10vh;width:var(--V);height:var(--V);margin-left:calc(var(--V) / -2);display:flex;align-items:center;justify-content:center;
  transition:transform .6s var(--ease),opacity .6s;cursor:pointer}
.slot .vis{position:relative;filter:drop-shadow(0 10px 16px rgba(40,30,20,.14));transition:transform .35s var(--ease)}
.slot.sel:hover .vis{transform:translateY(-.8vh)}
.vis.away{visibility:hidden}
#bk canvas{display:block;height:var(--V)}
#cb{width:var(--V);height:calc(var(--V) * .8)}
#cb .peek{position:absolute;left:4%;right:4%;bottom:46%;height:40%}
#cb .peek canvas{position:absolute;left:0;width:100%;border-radius:2px;box-shadow:0 -1px 0 rgba(0,0,0,.06)}
#cb .front{position:absolute;left:0;right:0;bottom:0;height:56%;background:#f4f1ea;border-radius:3px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 #fff,inset 0 -6px 12px rgba(0,0,0,.04)}
#cb .front span{font-weight:700;font-size:1.8vh;letter-spacing:.02em}
.lpv{display:block;width:var(--V);height:var(--V);border-radius:50%}
/* 재생 중: 곡의 악보가 시간을 따라 채워진다 */
#now{position:absolute;left:50%;top:calc(6vh + var(--V) + 18vh);transform:translateX(-50%);width:84vh;display:flex;align-items:center;gap:3vh;opacity:0;transition:opacity .6s;pointer-events:none}
#now.on{opacity:1}
#now .meta{width:17vh;flex:none}
#now canvas{flex:1;min-width:0;height:6.5vh}
#player{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80vh;height:38vh;cursor:pointer}

/* 눈앞 무대 */
#veil{position:fixed;inset:0;background:rgba(239,237,233,.88);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .5s;z-index:5}
#veil.on{opacity:1;pointer-events:auto}
.fly{position:fixed;left:0;top:0;z-index:6;transition:transform .9s var(--ease);transform-origin:0 0}

/* 부클릿 */
#book{position:fixed;z-index:6;perspective:3000px}
#book .pages{position:absolute;inset:0;transition:transform .8s var(--ease);transform-style:preserve-3d}
#book .base{position:absolute;left:50%;top:0;width:50%;height:100%}
#book .leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .9s var(--ease)}
#book .leaf.on{transform:rotateY(-180deg)}
#book .face{position:absolute;inset:0;backface-visibility:hidden;box-shadow:0 10px 30px rgba(40,30,20,.12)}
#book .face.b{transform:rotateY(180deg)}
#book canvas{width:100%;height:100%;display:block}

/* 악보 카드 */
#deck{position:fixed;inset:0;z-index:6;perspective:1800px;pointer-events:none}
.card{position:absolute;left:50%;top:50%;transition:transform .7s var(--ease),opacity .5s;transform-style:preserve-3d;pointer-events:auto;cursor:pointer}
.card .in{position:absolute;inset:0;transition:transform .7s var(--ease);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(40,30,20,.16)}
.card .f canvas{width:100%;height:100%;display:block}
.card .bk{transform:rotateY(180deg);background:var(--paper);padding:5% 6%;box-sizing:border-box;font-size:1.5vh;line-height:1.85;white-space:pre-wrap;columns:2;column-gap:5%}

.card .play{position:absolute;right:2.5%;top:5%;width:5.4vh;height:5.4vh;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center}
.card.cur .play{display:flex}
.card .play svg{width:1.8vh;height:1.8vh;margin-left:.3vh}

/* 가사 넣기 (작업용. 가사는 저장하지 않고 이 화면에서만 쓴다) */
#lyrBtn{position:fixed;right:14px;bottom:12px;z-index:30;font:12px Pretendard;padding:4px 9px;border:1px solid #d6d0c7;background:#faf8f4;color:#8d867d;cursor:pointer;display:none}
#lyrPanel{position:fixed;right:14px;bottom:44px;z-index:30;width:320px;background:#faf8f4;border:1px solid #d6d0c7;padding:10px;display:none;font-size:12px;color:#8d867d}
#lyrPanel textarea{width:100%;height:260px;box-sizing:border-box;font:12px/1.5 Pretendard}
#lyrPanel button{margin-top:6px;font:12px Pretendard}
</style>

<div id="q"><div class="in" id="qIn"></div></div>
<div id="intro"></div>
<div id="ui">
  <div id="frame"><div class="ic"><svg viewBox="0 0 10 10"><path d="M2 8L8 2M3.5 2H8V6.5" fill="none" stroke="#161412" stroke-width="1.2"/></svg></div>
    <div class="meta"><div class="sub" id="fSub"></div><div class="ttl" id="fTtl"></div></div></div>
  <div id="row"></div>
  <div id="now"><div class="meta"><div class="sub" id="nSub"></div><div class="ttl" id="nTtl"></div></div><canvas id="nCv" width="1800" height="180"></canvas></div>
  <canvas id="player"></canvas>
</div>
<div id="veil"></div>
<div id="deck"></div>
<div id="lyrPanel"># 곡 제목 한 줄, 그 아래 가사. 이 화면에서만 쓰이고 저장되지 않는다.<textarea id="lyrIn"></textarea><button id="lyrGo">적용</button></div>

<script src="file/score-data.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
await Promise.all(['800 60px Pretendard','700 40px Pretendard','600 30px Pretendard','500 30px Pretendard','400 30px Pretendard'].map(f=>document.fonts.load(f)));
const $=id=>document.getElementById(id);
const INK='#161412',SUB='#A19A92',PAPER='#fbf9f4',F='Pretendard';

// ── 감정악보 규칙 (prototype/감정악보_인터페이스.html 그대로) ──
const SC=window.SCORE,HAND=SC.bigloveHand,ALB=['TEAM BABY','THIRSTY','TEEN TROUBLES'];
function _lin(L,C,h){const A=C*Math.cos(h*Math.PI/180),B=C*Math.sin(h*Math.PI/180);const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
const _inG=v=>v.every(x=>x>=-1e-4&&x<=1+1e-4);
function _maxC(L,h){let c=0;while(c<.4&&_inG(_lin(L,c+.002,h)))c+=.002;return c;}
const _hex=v=>'#'+v.map(x=>{x=Math.max(0,Math.min(1,x));return Math.round(255*(x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055)).toString(16).padStart(2,'0')}).join('');
const TOPIC={L:[27,1],F:[150,.75],S:[255,.75],H:[85,.75],W:[320,.75]};const _CC={},_PK={};
function colOf(k,a,e){const key=k+a+e;if(_CC[key])return _CC[key];const[h,cap]=TOPIC[k]||TOPIC.L;
 if(!_PK[k]){let pL=.4,pC=0;for(let q=.4;q<=.8;q+=.005){const m=_maxC(q,h);if(m>pC){pC=m;pL=q;}}_PK[k]=[pL,pC*cap];}const[pL,pC]=_PK[k];
 const d=(5-a)/4;let L=pL-(pL-.27)*d,C=pC*(1-.7*d);const w=[.62,.32,0][Math.min(e,2)]*(1-.55*d);L=L+(.94-L)*w;C=Math.min(C*(1-w),_maxC(L,h));
 return _CC[key]={c:_hex(_lin(L,C,h)),dark:L<.55};}
const SP=.35;
function layoutUnits(units,o){const cols=[];let x=o.pad;
 units.forEach(u=>{u.w.forEach((ws,li)=>{let off=0;const st=[];ws.forEach(w=>{st.push(off);off+=w+SP;});
   cols.push({x,len:off-SP,boxes:(u.b[li]||[]).map(([a,b])=>({y0:st[a],y1:st[b]+ws[b],c:colOf(u.k||'L',u.a,u.e).c}))});x+=o.lineGap;});x+=o.unitGap-o.lineGap;});
 return {cols,w:x-o.unitGap+o.lineGap+o.pad};}
function drawCols(c,cols,base,o){cols.forEach(col=>col.boxes.forEach(b=>{c.fillStyle=b.c;c.fillRect(col.x-o.bw/2,base-b.y1*o.cell,o.bw,(b.y1-b.y0)*o.cell);}));}
const MAXLEN=Math.max(...SC.songs.flatMap(s=>s.u.flatMap(u=>u.w.map(ws=>ws.reduce((x,y)=>x+y+SP,0)-SP))));
const songsOf=al=>SC.songs.filter(s=>s.al===al).sort((a,b)=>a.tr-b.tr);
const ALL=ALB.flatMap(songsOf);
const scale=k=>({cell:4.2*k,bw:4.6*k,lineGap:6.4*k,unitGap:11*k,songGap:30*k,pad:0});
// 곡을 이어 붙이고 악보처럼 줄을 바꾼다
function staves(songs,o,maxW){const out=[[]];let x=0;songs.forEach(s=>{const L=layoutUnits(s.u,o);
  if(x+L.w>maxW&&out.at(-1).length){out.push([]);x=0;}out.at(-1).push({s,x,L});x+=L.w+o.songGap;});return out;}
function drawStaves(c,st,x0,y0,o,{titles=false,gap}){const H=MAXLEN*o.cell,step=H+gap;
  st.forEach((line,i)=>{const base=y0+i*step+H;line.forEach(({s,x,L})=>{drawCols(c,L.cols.map(cc=>({...cc,x:cc.x+x0+x})),base,o);
    if(titles){c.fillStyle=SUB;c.font=`400 ${Math.max(11,o.cell*2.6)}px ${F}`;c.textAlign='left';c.fillText(s.t,x0+x,base+o.cell*4.2);}});});
  return st.length*step;}
const canvas=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;};
// 글: 줄바꿈은 원고 그대로, 넘치면 어절로 접는다. 빈 줄은 문단 사이
function para(c,lines,x,y,maxW,{size=25,lh=48,color=INK,weight=400,align='left'}={}){c.font=`${weight} ${size}px ${F}`;c.fillStyle=color;c.textAlign=align;
  lines.forEach(l=>{if(!l){y+=lh*.6;return;}let line='';for(const w of l.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,y);y+=lh;line=w;}else line=t;}c.fillText(line,x,y);y+=lh;});return y;}

// ── 부클릿 (부클릿_설계.md 3판). 한 쪽 = A5 세로, 펼침 = 가로 ──
// 명암 리듬: 박스가 놓이는 쪽은 미색, 이야기 쪽(표지, 간지)은 검정. 악보는 검정 위에 두지 않는다 (표지의 Big Love만 예외)
const PW=1000,PH=1414,M=110,CREAM='#F3EFE8',BLACK='#141210',WHITE='#EDE8E0';
const BASE=PH*.4,TW=460; // 모든 쪽 글이 같은 기준선에서 시작, 한 줄 20자 안팎
const BODY={size:24,lh:44},SRC={size:15,lh:26,color:SUB,weight:500};
const LYR={};
// 앨범 커버 (햄이 assets에 넣으면 쓴다. 흑백으로만)
const COVER_FILE={'TEAM BABY':'cover_team_baby.jpg','THIRSTY':'cover_thirsty.jpg','TEEN TROUBLES':'cover_teen_troubles.jpg'},COVERS={};
function drawCover(c,al,alpha){const im=COVERS[al];if(!im)return;const s=Math.max(PW/im.width,PH/im.height);
  c.save();c.globalAlpha=alpha;c.filter='grayscale(1) contrast(1.1)';c.drawImage(im,(PW-im.width*s)/2,(PH-im.height*s)/2,im.width*s,im.height*s);c.restore();}
// 한 곡의 악보를 주어진 칸에 맞춰 그린다
function fitScore(c,units,x,y,w,h,f={cell:16,bw:18,lineGap:24,unitGap:52,pad:0}){const L=layoutUnits(units,f),sh=Math.max(...L.cols.map(cc=>cc.len))*f.cell,
  k=Math.min(w/L.w,h/sh),o={cell:f.cell*k,bw:f.bw*k,lineGap:f.lineGap*k,unitGap:f.unitGap*k,pad:x+(w-L.w*k)/2};drawCols(c,layoutUnits(units,o).cols,y+(h+sh*k)/2,o);}
const pages={};
pages.cover=(c)=>{c.fillStyle=WHITE;c.font=`800 128px ${F}`;c.textAlign='center';c.fillText('감정악보',PW/2,PH*.42);
  const tw=c.measureText('감정악보').width*.86;fitScore(c,HAND,(PW-tw)/2,PH*.42+50,tw,160);
  para(c,['검정치마 3집'],PW/2,PH-M,PW,{...SRC,color:WHITE,align:'center'});};
pages.cover.bg=BLACK;
const QUESTION=['검정치마 3집은 세 파트로 나뉜다.','TEAM BABY, THIRSTY, TEEN TROUBLES.','마흔 곡 대부분이 사랑을 말한다.','','한 사람이 말한 사랑은','세 파트에서 어떤 모양이 될까.'];
pages.s1L=(c)=>para(c,QUESTION,M,BASE,TW,BODY);
pages.s1R=(c)=>{const y=para(c,['가사에서 두 가지 말을 고른다.','문장을 끝맺는 말, 그리고 감정을 이름으로 부르는 말.','고른 말 위에 박스를 덮는다.','',
  '박스의 색은 세 가지로 정한다.','무엇에 대한 말인가. 사랑은 빨강, 사람들은 초록, 나 자신은 파랑.','어떤 마음인가. 이별에 가까울수록 어둡게.','얼마나 힘주어 말했나. 한 번도, 절대로 같은 말이 없을수록 옅게.','',
  '박스만 남기고 가사를 덮은 뒤 종이를 세워 돌리면','곡마다 한 장의 악보가 된다.'],M,BASE,TW,BODY);
  // 색표: 빨강 5 × 3. 가로 끝 이별, 확신. 세로 끝 옅게, 힘주어
  const x=M+30,y0=y+30,cw=50,ch=30,g=4;
  [2,1,0].forEach((e,r)=>{for(let a=1;a<=5;a++){c.fillStyle=colOf('L',a,e).c;c.fillRect(x+(a-1)*(cw+g),y0+r*(ch+g),cw,ch);}});
  c.fillStyle=SUB;c.font=`500 15px ${F}`;c.textAlign='left';c.fillText('이별',x,y0+3*(ch+g)+20);c.textAlign='right';c.fillText('확신',x+5*(cw+g)-g,y0+3*(ch+g)+20);
  c.save();c.translate(x-10,y0);c.rotate(-Math.PI/2);c.textAlign='right';c.fillText('힘주어',0,0);c.textAlign='left';c.fillText('옅게',-3*(ch+g)+g,0);c.restore();
  [['L','사랑'],['F','사람들'],['S','나 자신'],['H','가족과 고향'],['W','세상과 일상']].forEach(([k,n],i)=>{const yy=y0+6+i*22,xx=x+5*(cw+g)+50;
    c.fillStyle=colOf(k,5,2).c;c.beginPath();c.arc(xx,yy,6,0,7);c.fill();c.fillStyle=INK;c.font=`400 16px ${F}`;c.textAlign='left';c.fillText(n,xx+14,yy+5);});
  para(c,['가사 해석 기준. 네이버 블로그 「진희의 서재」 검정치마 가사 분석.'],M,PH-M,PW-2*M,SRC);};
// 펼침 2: Big Love 후렴 네 줄이 악보가 되기까지. 글 없이 왼쪽에서 오른쪽으로. 가사는 햄이 붙여 넣은 것만 쓴다 (메모리)
const CHORUS=HAND.slice(4,6);
function chorusWords(){const t=LYR['big love'];if(!t)return null;const units=t.split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean));
  const lines=[4,5].flatMap(i=>units[i]||[]);const ok=CHORUS.flatMap(u=>u.w).every((ws,i)=>lines[i]&&lines[i].split(/\s+/).length===ws.length);
  return ok?lines.map(l=>l.split(/\s+/)):null;}
function sheet(c,x0,y0,mode,fs,words){let y=y0,li=0;const sp=c.measureText(' ').width;c.font=`500 ${fs}px ${F}`;c.textBaseline='middle';
  CHORUS.forEach(u=>{u.w.forEach((ws,j)=>{const W=words?words[li].map(w=>c.measureText(w).width):ws.map(w=>w*fs);let x=x0;const xs=W.map(w=>{const s=x;x+=w+sp*1.2;return s;});
    const picked=i=>(u.b[j]||[]).some(([a,b])=>i>=a&&i<=b),col=colOf(u.k,u.a,u.e);
    if(mode==='paint'||mode==='boxes')(u.b[j]||[]).forEach(([a,b])=>{c.fillStyle=col.c;c.fillRect(xs[a]-4,y-fs*.62,xs[b]+W[b]-xs[a]+8,fs*1.24);});
    if(mode!=='boxes')W.forEach((w,i)=>{const on=mode==='text'||picked(i),ink=mode==='paint'&&picked(i)?(col.dark?'#fff':INK):on?INK:'#cbc5bc';
      if(words){c.fillStyle=ink;c.fillText(words[li][i],xs[i],y);}else if(!(mode==='paint'&&picked(i))){c.fillStyle=ink;c.fillRect(xs[i],y-fs*.18,w-3,fs*.36);}});

 const cam=new THREE.PerspectiveCamera(30,1,.01,20);cam.up.set(0,0,-1); // 위에서 내려다볼 때 화면 위쪽 = 박스 위쪽
 function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
   // 표지가 화면 높이를 거의 채우게
   const dist=(S*.5/.96)/Math.tan(cam.fov*Math.PI/360)/Math.min(1,cam.aspect);cam.position.set(0,dist+H,.0001);cam.lookAt(0,0,0);}
 fit();addEventListener('resize',fit);
 let t0=0,opening=false;const ez=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
 r.setAnimationLoop(now=>{if(opening){const t=Math.min(1,(now-t0)/2200);
     const a=ez(Math.min(1,t/.45)),b=ez(Math.max(0,(t-.3)/.7));
     lid.position.y=a*.35;lid.rotation.x=-b*.5;lid.position.z=-b*2.4;lid.position.x=b*.4;
     if(t>=.75&&!host.classList.contains('gone')){host.classList.add('gone');$('ui').classList.add('on');setTimeout(()=>{r.setAnimationLoop(null);host.remove();},1000);}}
   r.render(sc,cam);});
 const go=()=>{if(!qDone)return;if(!opening){opening=true;t0=performance.now();}};host.addEventListener('click',go);host.addEventListener('wheel',go,{passive:true});}
</script>
