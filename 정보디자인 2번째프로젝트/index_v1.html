<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>같은 사랑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#f5f4f1;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="score-data.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// 단위: 미터. 박스 32cm, 플레이어 45cm
const BG=0xf5f4f1;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(BG);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.7;
const camera=new THREE.PerspectiveCamera(32,1,.01,10);

// 빛: 왼쪽 위 창가 하나. 그림자는 바닥에만 떨어진다
const sun=new THREE.DirectionalLight(0xfff6ea,2.2);sun.position.set(-.6,1.4,.5);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-.8,right:.8,top:.8,bottom:-.8,near:.1,far:3});
sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=12;sun.shadow.blurSamples=20;sun.shadow.bias=-.0004;
scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.ShadowMaterial({opacity:.26}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// 텍스처: 종이 결
function canvasTex(w,h,fn,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const grain=canvasTex(512,512,(c,w,h)=>{const d=c.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*60;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}c.putImageData(d,0,0);},false);
grain.wrapS=grain.wrapT=THREE.RepeatWrapping;
const paper=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.88,bumpMap:grain,bumpScale:.6,...extra});
const mesh=(geo,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;};
const box=(w,h,d,mat,x,y,z)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z);

await Promise.all(['700 40px "Gowun Batang"','400 20px "Gowun Batang"'].map(f=>document.fonts.load(f)));

// ── 앨범 박스 (LP 세 장짜리 박스 세트) ──
const W=.32,H=.042,T=.003;
const album=new THREE.Group(), albumLift=new THREE.Group();album.add(albumLift);scene.add(album);
const boxMat=paper(0xf1efea);
const base=new THREE.Group();albumLift.add(base);
base.add(box(W-.004,T,W-.004,boxMat,0,T/2,0));
[[0,(W-.004)/2-T/2,W-.004,T],[0,-(W-.004)/2+T/2,W-.004,T],[(W-.004)/2-T/2,0,T,W-.004],[-(W-.004)/2+T/2,0,T,W-.004]]
  .forEach(([x,z,w,d])=>base.add(box(w,H-.004,d,boxMat,x,(H-.004)/2,z)));
// 뚜껑: 윗면이 표지. 표지엔 질문 하나만
const cover=canvasTex(1024,1024,(c,w,h)=>{c.fillStyle='#f3f1ec';c.fillRect(0,0,w,h);
  c.fillStyle='#3a3631';c.font='700 34px "Gowun Batang"';c.textAlign='center';c.fillText('같은 사랑을 어떻게 다르게 썼나',w/2,h*.9);});
const lid=new THREE.Group();albumLift.add(lid);
const lidTop=mesh(new THREE.BoxGeometry(W,T,W),[boxMat,boxMat,paper(0xffffff,{map:cover}),boxMat,boxMat,boxMat],0,H+T/2,0);
lid.add(lidTop);
const SK=.026;
[[0,W/2-T/2,W,T],[0,-W/2+T/2,W,T],[W/2-T/2,0,T,W],[-W/2+T/2,0,T,W]].forEach(([x,z,w,d])=>lid.add(box(w,SK,d,boxMat,x,H-SK/2,z)));

// LP 세 장: 아직 무늬 없음. 홈 결과 라벨 자리만
const LPR=.151,LPT=.0025;
const grooveFn=(c,w,h,col)=>{c.fillStyle=col;c.fillRect(0,0,w,h);const cx=w/2;
  for(let r=w*.17;r<w*.49;r+=1.6){c.strokeStyle=`rgba(0,0,0,${.03+Math.random()*.05})`;c.beginPath();c.arc(cx,cx,r,0,7);c.stroke();}
  c.fillStyle='#ebe4d4';c.beginPath();c.arc(cx,cx,w*.165,0,7);c.fill();c.fillStyle='#bdb6a8';c.beginPath();c.arc(cx,cx,w*.006,0,7);c.fill();};
const lpTex=canvasTex(1024,1024,(c,w,h)=>grooveFn(c,w,h,'#d9ceb6'));
const lpBump=canvasTex(1024,1024,(c,w,h)=>grooveFn(c,w,h,'#808080'),false);
const vinyl=new THREE.MeshPhysicalMaterial({color:0xffffff,map:lpTex,bumpMap:lpBump,bumpScale:.4,roughness:.32,clearcoat:1,clearcoatRoughness:.12,sheen:.3});
const lpEdge=new THREE.MeshPhysicalMaterial({color:0xe2dac8,roughness:.3,clearcoat:1});
const lps=[0,1,2].map(i=>{const g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(LPR,LPR,LPT,128),[lpEdge,vinyl,vinyl],0,LPT/2,0));albumLift.add(g);return g;});

// ── 감정악보 (2차 수정작업). 색과 배치는 prototype/감정악보_인터페이스.html 규칙 그대로 ──
const SC=window.SCORE, HAND=SC.bigloveHand, ALB=['TEAM BABY','THIRSTY','TEEN TROUBLES'];
function _lin(L,C,h){const A=C*Math.cos(h*Math.PI/180),B=C*Math.sin(h*Math.PI/180);const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
const _inG=v=>v.every(x=>x>=-1e-4&&x<=1+1e-4);
function _maxC(L,h){let c=0;while(c<.4&&_inG(_lin(L,c+.002,h)))c+=.002;return c;}
const _hex=v=>'#'+v.map(x=>{x=Math.max(0,Math.min(1,x));return Math.round(255*(x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055)).toString(16).padStart(2,'0')}).join('');
const TOPIC={L:[27,1],F:[150,.75],S:[255,.75],H:[85,.75],W:[320,.75]};const _CC={},_PK={};
function colOf(k,a,e){const key=k+a+e;if(_CC[key])return _CC[key];const[h,cap]=TOPIC[k]||TOPIC.L;
 if(!_PK[k]){let pL=.4,pC=0;for(let q=.4;q<=.8;q+=.005){const m=_maxC(q,h);if(m>pC){pC=m;pL=q;}}_PK[k]=[pL,pC*cap];}const[pL,pC]=_PK[k];
 const d=(5-a)/4;let L=pL-(pL-.27)*d,C=pC*(1-.7*d);const w=[.62,.32,0][Math.min(e,2)]*(1-.55*d);L=L+(.94-L)*w;C=Math.min(C*(1-w),_maxC(L,h));
 return _CC[key]={c:_hex(_lin(L,C,h)),dark:L<.55};}
const SP=.35;
function layoutUnits(units,o){const cols=[];let x=o.pad;
 units.forEach(u=>{u.w.forEach((ws,li)=>{let off=0;const st=[];ws.forEach(w=>{st.push(off);off+=w+SP;});
   cols.push({x,len:off-SP,boxes:(u.b[li]||[]).map(([a,b])=>({y0:st[a],y1:st[b]+ws[b],c:colOf(u.k||'L',u.a,u.e).c}))});x+=o.lineGap;});x+=o.unitGap-o.lineGap;});
 return {cols,w:x-o.unitGap+o.lineGap+o.pad};}
// 악보: 줄 하나 = 세로 기둥 하나, 아래에서 위로
function drawCols(c,cols,base,o){cols.forEach(col=>col.boxes.forEach(b=>{c.fillStyle=b.c;c.fillRect(col.x-o.bw/2,base-b.y1*o.cell,o.bw,(b.y1-b.y0)*o.cell);}));}
// 돌리기 전 가사 시트: 줄 하나 = 가로 한 줄. 어절 자리(회색), 서술어 박스(테두리 또는 색)
function drawSheet(c,units,x0,y0,o,{words,boxes,color}){let y=y0;
 units.forEach(u=>{u.w.forEach((ws,li)=>{let off=0;const st=ws.map(w=>{const s=off;off+=w+SP;return s;});
   if(words){c.fillStyle='#e4dfd6';ws.forEach((w,i)=>c.fillRect(x0+st[i]*o.cell,y,w*o.cell,o.bh));}
   if(boxes)(u.b[li]||[]).forEach(([a,b])=>{const x=x0+st[a]*o.cell,W=(st[b]+ws[b]-st[a])*o.cell;
     if(color){c.fillStyle=colOf(u.k,u.a,u.e).c;c.fillRect(x,y,W,o.bh);}else{c.strokeStyle='#2a2723';c.lineWidth=2;c.strokeRect(x+1,y+1,W-2,o.bh-2);}});
   y+=o.lineGap;});y+=o.unitGap-o.lineGap;});}
const GRAY='#9a948a';
// 첫 장: 첫 단 프로젝트 설명(문장 미정, 비움), 다음 단 인코딩 체계
// 인계 문서 7번 B안 (햄 선택). 문장은 손대지 않는다
const INTRO='같은 사랑을 어떻게 이렇게 다르게 부를 수 있을까. 검정치마 3집은 세 파트, 40곡이 전부 사랑 노래다. 가사에서 감정이 결정되는 말에만 색을 칠해 감정악보를 만들었다. 가사를 지우고 감정만 남겼을 때 세 파트는 어떻게 보일까.';
function pageFirst(c,w){
 {c.fillStyle='#2a2723';c.font='26px "Gowun Batang"';c.textAlign='left';let line='',y=150+20;const maxW=w/2-130;
  for(const word of INTRO.split(' ')){const t=line?line+' '+word:word;if(c.measureText(t).width>maxW){c.fillText(line,90,y);y+=44;line=word;}else line=t;}c.fillText(line,90,y);}
 const x=w/2+40,y=150,cw=64,ch=38,g=5;
 [2,1,0].forEach((e,r)=>{for(let a=1;a<=5;a++){c.fillStyle=colOf('L',a,e).c;c.fillRect(x+(a-1)*(cw+g),y+r*(ch+g),cw,ch);}});
 c.fillStyle=GRAY;c.font='22px "Gowun Batang"';c.textAlign='left';c.fillText('이별',x,y+3*(ch+g)+26);
 c.textAlign='right';c.fillText('확신',x+5*(cw+g)-g,y+3*(ch+g)+26);
 c.save();c.translate(x-14,y);c.rotate(-Math.PI/2);c.textAlign='right';c.fillText('세게',0,0);c.textAlign='left';c.fillText('덤덤',-3*(ch+g)+g,0);c.restore();}
// 다음 장: Big Love가 악보가 되어 가는 과정. 가사 → 서술어 박스 → 색 | 90도 회전 → 악보
const STEP=HAND.slice(0,2),SO={cell:28,bh:24,lineGap:38,unitGap:64};
function pageStepL(c,w){[[1,0,0],[1,1,0],[0,1,1]].forEach(([words,boxes,color],i)=>drawSheet(c,STEP,90,140+i*270,SO,{words,boxes,color}));}
function pageStepR(c,w){const o={cell:SO.cell,bw:SO.bh,lineGap:SO.lineGap,unitGap:SO.unitGap,pad:90+SO.bh/2};drawCols(c,layoutUnits(STEP,o).cols,500,o);
 const f={cell:16,bw:18,lineGap:24,unitGap:52,pad:0},L=layoutUnits(HAND,f),s=Math.min(1,(w-180)/L.w),o2={cell:f.cell*s,bw:f.bw*s,lineGap:f.lineGap*s,unitGap:f.unitGap*s,pad:90};
 drawCols(c,layoutUnits(HAND,o2).cols,900,o2);}
// 다음 장: 세 앨범 악보를 펼침면 하나에 나란히. 같은 축척, 악보처럼 줄 바꿈
const wide=document.createElement('canvas');wide.width=2048;wide.height=1024;
{const c=wide.getContext('2d'),M=90,maxW=2048-M*2,songs=SC.songs;
 const maxLen=Math.max(...songs.flatMap(s=>s.u.flatMap(u=>u.w.map(ws=>ws.reduce((x,y)=>x+y+SP,0)-SP))));
 const plan=k=>{const o={cell:4.2*k,bw:4.6*k,lineGap:6.4*k,unitGap:11*k,songGap:30*k,pad:0},H=maxLen*o.cell;let y=0;
   const out=ALB.map(al=>{const staves=[[]];let x=0;songs.filter(s=>s.al===al).forEach(s=>{const L=layoutUnits(s.u,o);
     if(x+L.w>maxW&&staves.at(-1).length){staves.push([]);x=0;}staves.at(-1).push(L.cols.map(cc=>({...cc,x:cc.x+x})));x+=L.w+o.songGap;});
     const top=y;y+=30+staves.length*(H+12*k)+28;return {al,top,staves};});return {o,H,out,h:y};};
 let k=1.6;while(plan(k).h>1024-M*1.4&&k>.3)k-=.02;const {o,H,out}=plan(k);
 out.forEach(({al,top,staves})=>{c.fillStyle=GRAY;c.font='18px "Gowun Batang"';c.textAlign='left';c.fillText(al,M,M*.7+top+18);
   staves.forEach((st,i)=>drawCols(c,st.flat().map(cc=>({...cc,x:cc.x+M})),M*.7+top+30+i*(H+12*k)+H,o));});}
const half=x=>c=>c.drawImage(wide,x,0,1024,1024,0,0,1024,1024);
// LP: 한 장에 앨범 하나. 악보를 원으로 감는다. 시간 = 12시부터 시계 방향, 줄 하나 = 반지름 방향 기둥 하나. 세 장 같은 축척
{const maxLen=Math.max(...SC.songs.flatMap(s=>s.u.flatMap(u=>u.w.map(ws=>ws.reduce((x,y)=>x+y+SP,0)-SP))));
 const o={cell:1,lineGap:1,unitGap:1.7,pad:0},SONG_GAP=4.7; // 프로토타입 비율 (lineGap 6.4 : unitGap 11 : songGap 30)
 lps.forEach((g,i)=>{const tex=canvasTex(1024,1024,(c,w,h)=>{grooveFn(c,w,h,'#d9ceb6');
   const cols=[];let x=0;SC.songs.filter(s=>s.al===ALB[i]).sort((a,b)=>a.tr-b.tr).forEach(s=>{const L=layoutUnits(s.u,o);
     L.cols.forEach(cc=>cols.push({...cc,x:cc.x+x}));x+=L.w+SONG_GAP;});
   const r0=w*.18,r1=w*.485,step=Math.PI*2/x,bw=step*(r0+r1)/2*.7;
   c.translate(w/2,w/2);cols.forEach(cc=>{c.save();c.rotate(cc.x*step);
     cc.boxes.forEach(b=>{const ra=r0+(r1-r0)*b.y0/maxLen,rb=r0+(r1-r0)*b.y1/maxLen;c.fillStyle=b.c;c.fillRect(-bw/2,-rb,bw,rb-ra);});c.restore();});});
  g.children[0].material=[lpEdge,new THREE.MeshBasicMaterial({map:tex,toneMapped:false}),vinyl];});} // 지면처럼 색은 데이터 그대로
// 부클릿: 뒤표지 위에 낱장이 겹쳐 있고, 왼쪽 등을 축으로 한 장씩 넘어간다. 펼침면마다 [왼쪽, 오른쪽]
const SPREADS=[[null,pageFirst],[pageStepL,pageStepR],[half(0),half(1024)]];
const pageMat=(fn,back=false,color='#fbfaf6')=>{const t=canvasTex(1024,1024,(c,w,h)=>{c.fillStyle=color;c.fillRect(0,0,w,h);if(fn)fn(c,w);});
  if(back){t.center.set(.5,.5);t.rotation=Math.PI;} // 넘긴 뒤 뒷면이 바로 보이게
  return new THREE.MeshBasicMaterial({map:t,toneMapped:false});}; // 조명에 색이 바래지 않게: 지면 색은 데이터 그대로
const BW=.296,LT=.0005,BACK=.0012,NL=SPREADS.length;
const booklet=new THREE.Group(), bookletLift=new THREE.Group();booklet.add(bookletLift);albumLift.add(booklet);
const edge=paper(0xf6f4ee);
bookletLift.add(box(BW,BACK,BW,[edge,edge,pageMat(SPREADS[NL-1][1]),edge,edge,edge],0,BACK/2,0));
const leafY=k=>BACK+(NL-k-.5)*LT, leafFlatY=k=>BACK+(k+.5)*LT;
const leaves=SPREADS.map((_,k)=>{const h=new THREE.Group();h.position.set(-BW/2,leafY(k),0);
  const front=k?pageMat(SPREADS[k-1][1]):pageMat((c,w)=>{c.fillStyle='#2a2723';c.font='700 76px "Gowun Batang"';c.textAlign='center';c.fillText('감정악보',w/2,w/2+26);},false,'#ece8df');
  h.add(box(BW,LT*.9,BW,[edge,edge,front,pageMat(SPREADS[k][0],true),edge,edge],BW/2,0,0));bookletLift.add(h);return h;});
let page=0; // 넘긴 장 수
const flip=(k,open,delay=0)=>Promise.all([tw(leaves[k].rotation,{z:open?Math.PI:0},800,delay),tw(leaves[k].position,{y:open?leafFlatY(k):leafY(k)},800,delay)]);

// ── 플레이어 ──
const player=new THREE.Group();player.position.set(.34,0,-.03);scene.add(player);
const satin=new THREE.MeshPhysicalMaterial({color:0xecebe7,roughness:.38,clearcoat:.4,clearcoatRoughness:.3});
const alu=new THREE.MeshStandardMaterial({color:0xd9dadc,metalness:1,roughness:.22});
const chrome=new THREE.MeshStandardMaterial({color:0xeeeeee,metalness:1,roughness:.08});
const rubber=new THREE.MeshStandardMaterial({color:0x1d1c1b,roughness:.92});
const PW=.45,PD=.36,PH=.075,FT=.014,TOP=FT+PH;
player.add(mesh(new RoundedBoxGeometry(PW,PH,PD,4,.01),satin,0,FT+PH/2,0));
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>player.add(mesh(new THREE.CylinderGeometry(.022,.024,FT,32),rubber,a*(PW/2-.04),FT/2,b*(PD/2-.04))));
const PX=-.045;
player.add(mesh(new THREE.CylinderGeometry(.152,.152,.014,128),alu,PX,TOP+.007,0));
player.add(mesh(new THREE.CylinderGeometry(.148,.148,.003,128),rubber,PX,TOP+.0155,0));
player.add(mesh(new THREE.CylinderGeometry(.0035,.0035,.022,16),chrome,PX,TOP+.025,0));
// 톤암: 받침, 팔, 헤드셸, 무게추, 거치대
const AX=.17,AZ=-.12;
player.add(mesh(new THREE.CylinderGeometry(.028,.03,.02,48),alu,AX,TOP+.01,AZ));
player.add(mesh(new THREE.CylinderGeometry(.012,.012,.03,32),chrome,AX,TOP+.035,AZ));
const arm=mesh(new THREE.CylinderGeometry(.0042,.0042,.24,24),chrome,AX,TOP+.046,AZ+.1);arm.rotation.x=Math.PI/2;player.add(arm);
player.add(mesh(new THREE.CylinderGeometry(.014,.014,.03,32),rubber,AX,TOP+.046,AZ-.045).rotateX(Math.PI/2));
const shell=box(.018,.006,.045,new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:.6,roughness:.35}),AX-.006,TOP+.042,AZ+.235);shell.rotation.y=.35;player.add(shell);
player.add(mesh(new THREE.CylinderGeometry(.004,.004,.04,16),alu,AX+.012,TOP+.02,AZ+.2));
player.add(mesh(new THREE.CylinderGeometry(.02,.02,.012,48),alu,-PW/2+.045,TOP+.006,PD/2-.045));

// ── 포즈 ──
// 박스 안: 바닥 위에 LP 세 장, 그 위에 부클릿
const IN={lp:i=>({p:[0,T+i*LPT,0],r:[0,i*.7,0]}),booklet:{p:[0,T+3*LPT,0],r:[0,0,0]}};
// 연 뒤 (앨범 기준 좌표): 뚜껑은 뒤로 비켜 두고, 부클릿은 왼쪽 앞, LP는 앞으로 펼쳐 놓는다
const ALB_OPEN=[-.14,0,-.1];
const OUT={lid:{p:[-.42,-(H-SK),-.02],r:[0,.22,0]},booklet:{p:[-.33,0,.27],r:[0,-.1,0]},
  lp:i=>({p:[-.06+i*.11,i*.0026,.31+i*.012],r:[0,i*.9,0]})};
const CAM={table:{p:[.06,1.0,1.08],t:[.06,0,.02]},open:{p:[0,1.02,1.12],t:[-.02,0,.1]}};
album.position.set(-.24,0,.02);
lps.forEach((g,i)=>set(g,IN.lp(i)));set(booklet,IN.booklet);
camera.position.set(...CAM.table.p);const camT=new THREE.Vector3(...CAM.table.t);

// ── 트윈 ──
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2, tws=[];
function tw(o,to,dur=800,delay=0){return new Promise(res=>{tws.push({o,to,dur,t0:performance.now()+delay,res});});}
function tick(now){for(let i=tws.length-1;i>=0;i--){const w=tws[i];if(now<w.t0)continue;
  if(!w.from){w.from={};for(const k in w.to)w.from[k]=w.o[k];}
  const t=Math.min(1,(now-w.t0)/w.dur),e=ease(t);for(const k in w.to)w.o[k]=w.from[k]+(w.to[k]-w.from[k])*e;
  if(t===1){tws.splice(i,1);w.res();}}}
const v3=a=>({x:a[0],y:a[1],z:a[2]});
function set(o,{p,r}){o.position.set(...p);o.rotation.set(...r);}
const pose=(o,{p,r},dur,delay)=>Promise.all([tw(o.position,v3(p),dur,delay),tw(o.rotation,v3(r),dur,delay)]);
const camTo=(k,dur=1200)=>Promise.all([tw(camera.position,v3(CAM[k].p),dur),tw(camT,v3(CAM[k].t),dur)]);

// ── 장면 흐름: 책상 → 연 앨범 → 펼친 부클릿 ──
let state='table',busy=false;
async function openAlbum(){
  // 두 손으로 들어 올려 살짝 기울인다
  camTo('open',2600);
  await Promise.all([tw(album.position,{x:-.18,y:.15,z:.08},900),tw(album.rotation,{x:.32,z:.05},900)]);
  await tw(lid.position,{y:.09},550);
  await Promise.all([pose(lid,OUT.lid,800),tw(album.position,v3(ALB_OPEN),900,150),tw(album.rotation,{x:0,z:0},900,150)]);
  await Promise.all([pose(booklet,{p:[OUT.booklet.p[0]*.3,.06,OUT.booklet.p[2]*.3],r:[0,0,0]},450)]);
  await Promise.all([pose(booklet,OUT.booklet,650),...lps.map((g,i)=>pose(g,{p:[0,.03+i*.01,0],r:IN.lp(i).r},380,200+i*90))]);
  await Promise.all(lps.map((g,i)=>pose(g,OUT.lp(i),700,(2-i)*120)));
}
async function closeAlbum(){
  await Promise.all([...lps.map((g,i)=>pose(g,{p:[0,.03+i*.01,0],r:IN.lp(i).r},650,i*100)),pose(booklet,{p:[OUT.booklet.p[0]*.3,.06,OUT.booklet.p[2]*.3],r:[0,0,0]},650)]);
  await Promise.all([...lps.map((g,i)=>pose(g,IN.lp(i),350,i*60)),pose(booklet,IN.booklet,450,150)]);
  await pose(lid,{p:[0,.09,0],r:[0,0,0]},800);
  await tw(lid.position,{y:0},450);
  camTo('table',1500);
  await tw(album.position,{x:-.24,y:0,z:.02},1000);
}
// 부클릿: 눈앞으로 들어 올린 뒤 표지를 넘긴다
const bookletWorld=new THREE.Vector3(),bookletQuat=new THREE.Quaternion();
async function openBooklet(){
  booklet.getWorldPosition(bookletWorld);booklet.getWorldQuaternion(bookletQuat);scene.attach(booklet);
  const c=camera.position,t=camT,P=c.clone().lerp(t,.58),d=c.clone().sub(P);
  await pose(booklet,{p:[P.x+BW/2,P.y,P.z],r:[Math.atan2(d.z,d.y),0,0]},1100);
  await flip(0,true);page=1;
}
async function closeBooklet(){
  await Promise.all(leaves.slice(0,page).map((_,k)=>flip(k,false,(page-1-k)*90)));page=0;
  const e=new THREE.Euler().setFromQuaternion(bookletQuat);
  await pose(booklet,{p:bookletWorld.toArray(),r:[e.x,e.y,e.z]},1000);
  albumLift.attach(booklet);
}
// LP: 눈앞으로 들어 올려 판 면을 정면으로 본다
let lpOpen=null;const lpWorld=new THREE.Vector3(),lpQuat=new THREE.Quaternion();
async function openLP(g){lpOpen=g;g.getWorldPosition(lpWorld);g.getWorldQuaternion(lpQuat);scene.attach(g);
  const c=camera.position,P=c.clone().lerp(camT,.62),d=c.clone().sub(P);
  await pose(g,{p:[P.x,P.y,P.z],r:[Math.atan2(d.z,d.y),0,0]},1100);}
async function closeLP(){const g=lpOpen,e=new THREE.Euler().setFromQuaternion(lpQuat);
  await pose(g,{p:lpWorld.toArray(),r:[e.x,e.y,e.z]},1000);albumLift.attach(g);lpOpen=null;}
const run=async(fn,next)=>{busy=true;await fn();state=next;busy=false;};
function act(target,point){if(busy)return;
  if(state==='booklet'&&target==='booklet'){ // 등 오른쪽을 누르면 다음 장, 왼쪽이면 이전 장
    const next=booklet.worldToLocal(point.clone()).x>-BW/2;
    if(next&&page<NL)run(async()=>{await flip(page,true);page++;},'booklet');
    else if(!next&&page>1)run(async()=>{page--;await flip(page,false);},'booklet');}
  else if(state==='table'&&target==='album')run(openAlbum,'open');
  else if(state==='open'&&target==='booklet')run(openBooklet,'booklet');
  else if(state==='open'&&target==='lp')run(()=>openLP(point.lp),'lp');
  else if(!target&&state==='lp')run(closeLP,'open');
  else if(!target&&state==='booklet')run(closeBooklet,'open');
  else if(!target&&state==='open')run(closeAlbum,'table');}

// ── 고르기: 지금 단계에서 집을 수 있는 물건만 반응 ──
album.userData={click:'album',lift:albumLift};booklet.userData={click:'booklet',lift:bookletLift};
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let hover=null;
lps.forEach(g=>g.userData={click:'lp',lift:g.children[0]});
const pickable=()=>state==='table'?[album]:state==='open'?[booklet,...lps]:state==='booklet'?[booklet]:[];
function pick(e){ptr.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickable(),true)[0];let o=hit&&hit.object;while(o&&!o.userData.click)o=o.parent;
  return o?{o,point:o.userData.click==='lp'?{lp:o}:hit.point}:null;}
renderer.domElement.addEventListener('pointermove',e=>{const h=busy?null:pick(e);hover=h&&h.o;renderer.domElement.style.cursor=hover?'pointer':'default';});
renderer.domElement.addEventListener('click',e=>{const h=pick(e);act(h&&h.o.userData.click,h&&h.point);});
addEventListener('keydown',e=>{if(e.key==='Escape')act(null);});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;
  camera.fov=camera.aspect<1?52:32;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
renderer.setAnimationLoop(now=>{tick(now);
  [album,booklet,...lps].forEach(o=>{const l=o.userData.lift;l.position.y+=((hover===o&&!busy&&state!=='booklet'&&state!=='lp'?.012:0)-l.position.y)*.15;});
  camera.lookAt(camT);renderer.render(scene,camera);});
</script>
